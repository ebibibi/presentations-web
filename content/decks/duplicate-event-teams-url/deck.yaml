slug: duplicate-event-teams-url
title: その「イベントを複製」、Teams会議は同じままです
summary: 新しい Outlook / Outlook on the web / Teams のカレンダーで使える「イベントを複製 (Duplicate Event)」は、従来の Outlook の会議コピー＆ペーストとは別の機能で、会議の複製はサポートされている。ただし Teams 会議が設定された予定を複製すると、Teams 会議の URL は複製元から引き継がれる。出席者だけ差し替えて別の会議として使うと、前の相手が入れてしまい、チャットやファイルまで見えてしまう。仕組みと安全な使いどころを整理する。
status: draft
visibility: public
createdAt: "2026-09-04"
updatedAt: "2026-09-04"
order: 112
