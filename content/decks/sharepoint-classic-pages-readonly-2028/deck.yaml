  publishedAt: "2026-11-07"
slides:
  - id: opening
    title: あなたのSharePoint、編集できなくなる？
    durationInFrames: 300
    notes: 先に答えを全部言う。2026年8月31日にMicrosoftが正式に発表した。2028年10月1日から、既存のクラシックページは全テナントで読み取り専用になる。その前の2027年3月1日には、クラシック発行サイトの新規作成が止まる。消えるわけではなく、見ることはできる。でも直せなくなる。編集し続けたいページは、それまでにモダンへ移す。今日やるのは棚卸し。よく「クラシックサイトが使えなくなる」と言われるが、正確には「サイトは残るが、ページが編集できなくなる」。この違いが今日の話の中心。
  - id: what-changes
    title: 「使えなくなる」の正確な意味
    durationInFrames: 300
    notes: 公式FAQは「既存のクラシックサイトは残る。コンテンツの変更も削除もしない」と明言している。止まるのは、作ること、編集すること。Microsoftの Mission Critical ブログに操作ごとの表があるので、それを整理した。新規作成、編集、保存、チェックイン・アウト、発行ができなくなる。一方で、閲覧、アップロード、削除、名前変更・移動、コピー、プロパティ編集、バージョン復元、権限変更は続けられる。つまりファイルを失う話ではなく、「情報を更新できなくなる」話。更新されない手順書やお知らせが残り続けることが、実害になる。
  - id: team-site-trap
    title: 「チームサイトだから関係ない」が一番危ない
    durationInFrames: 330
    notes: ここが今日の山場。解説記事に「クラシックチームサイトは影響なし」と書いてあるものがある。これはサイトを作るテンプレートの話としては正しい。作成が止まるのは発行系のテンプレートだけ。でも読み取り専用の対象はページの種類で決まる。wikiページとWebパーツページが対象に入っている。そしてMicrosoftのモダン化ドキュメントには、クラシックチームサイトのホームなどのサイトページはwikiページやWebパーツページだと書いてある。組み合わせると、モダン化していないチームサイトのホームも読み取り専用の対象に入ると読める。この結論はドキュメントを組み合わせた解釈なので、実物はAssessment Toolで確認してほしい。一方、リスト・ライブラリのビューとリストフォームは今回の対象外。ファイルを置いて使っているだけなら影響は小さい。
  - id: are-you-the-five-percent
    title: 5%未満なら、うちは関係ない？
    durationInFrames: 270
    notes: Microsoftは「これらのクラシック機能を使っているのは月間アクティブテナントの5%未満」と書いている。少なく聞こえるが、これはテナント単位の数字で、あなたの会社が5%の側かどうかは教えてくれない。古くからSharePointを使っている会社ほど、昔の部門サイトや手順書wikiが残っていがち。TODO（胡田さんへ）：ここに自分の実体験を一言入れてほしい。例えば、昔作った、あるいは現場で見たクラシックサイトの話。事実として話せるものがあれば差し替える。無ければこのまま進める。
  - id: timeline
    title: じわじわ閉じてきた流れ
    durationInFrames: 330
    notes: 今回は突然の話ではない。2025年9月15日に発行サイトの作成制限とスクリプト規制が始まった。2026年3月15日には、発行サイトのスクリプト規制を遅らせるテナント全体のスイッチが終了予定になった。4月2日にSharePointアドインが停止。7月にはSharePointアラートの完全停止が始まると告知された。そして8月31日に今回の発表が出た。つまりこれは古い仕組みを順番に閉じてきた流れの総仕上げに近い。ここからが次の2つの日付。
  - id: two-phases
    title: 2つの期限と、前倒しになるケース
    durationInFrames: 330
    notes: 期限を表にした。2027年3月1日、全テナントで発行サイトの作成と発行機能の有効化が止まる。設定AllowClassicPublishingSiteCreationはFalse固定になり変更できない。2025年に始まった制限を、設定でも戻せない形にする段階と理解するとよい。全世界向けの展開は3月上旬から4月上旬の予定。2028年10月1日、既存テナントでもクラシックページの作成と編集、スクリプトの追加と更新が止まる。注意点は新しいテナント。2027年3月1日以降に作ったテナントは、最初からこの制限がかかる。テナント統合や組織再編で新しいテナントへ引っ越す会社は、2028年を待たずに影響を受ける。SharePoint Serverからの移行も同じで、ページは移せても読み取り専用になり、スクリプトは保持されない可能性がある。
  - id: custom-scripts
    title: スクリプトは動く。でも直せない
    durationInFrames: 300
    notes: 見落とされやすいのがカスタムスクリプト。すでに入っているスクリプトは動き続けると公式に書かれている。だから当日に何かが止まって気づく、という形にはなりにくい。でも追加も更新もできなくなる。DenyAddAndCustomizePagesがTrue固定になるから。動いているが誰も直せない状態になるので、不具合が出たときに困る。リストやライブラリのビューは読み取り専用の対象外だが、そこに埋め込んだスクリプトは規制の対象。一方、モダンページとSPFxは影響を受けない。プロパティバッグを更新しているだけなら、別の設定で許可できる。
  - id: why-now
    title: なぜ今なのか
    durationInFrames: 210
    notes: 短く。理由は2つ。1つはセキュリティと管理。サーバー側で描画してスクリプトを自由に入れられる仕組みは、統制しにくい。もう1つはCopilot。Microsoftは、クラシックページがMicrosoft 365 Copilotを支えるコンテンツ形式に十分に反映されないと書いている。AIから見えにくい場所に情報を置いたままにしない、という話でもある。
  - id: find-it
    title: まず2つの道具で探す
    durationInFrames: 300
    notes: 調べる道具は公式に2つ。Microsoft 365 Assessment Toolは「何があるか」を調べる。クラシックページの種類、Webパーツ、モダン化のしやすさ、利用状況まで分かる。読み取り専用のツールで、移行はしない。Classic Pagesのスキャンはバージョン1.15.0以降。Purview監査は「使われているか」を調べる。SharePoint Classic Activitiesというカテゴリに、作成、編集、閲覧の3つのイベントがある。編集のイベントがあるページが最優先。そして公式に「クラシックコンテンツが見つからなければ対応不要」と書かれている。まず調べるだけで、心配が終わる会社もある。
  - id: how-to-move
    title: 全部は移さない。仕分けて移す
    durationInFrames: 330
    notes: 全部を移す必要はない。公式の言い方は「編集可能なままにする必要があるページをモダン化する」。読むだけの古いページは読み取り専用のままでよい場合がある。これが一番工数を減らす判断。編集し続けるチームサイトのページは、PnP PowerShellのConvertTo-PnPPageで変換する。発行ポータルは単純な変換ができず、グループ接続やモダンページ化もサポートされていないので、新しいコミュニケーションサイトへ作り直す前提で計画する。カスタムHTMLやスクリプトの多いページは、プレビューのPage Migration Agentを試す手もある。注意は3つ。これらのオープンソースツールにはMicrosoftのSLAがない。マッピングスコアが100%でも成功の証明にはならないので、1枚ずつ確認する。PnP Frameworkは2027年第2四半期にアーカイブ予定で、エンジンはPnP Core SDKへ移るので、古い手順記事に頼らず最新のドキュメントを見る。
  - id: checklist
    title: 今日確認する3つ
    durationInFrames: 240
    notes: 今日やることは3つだけ。1つ目、Purviewの監査ログでSharePoint Classic Activitiesを検索し、編集されているページがあるかを見る。2つ目、Assessment Toolでクラシックページの全体量を出す。3つ目、編集が必要なページに担当者と期限を決める。Microsoftのブログでは、2026年12月までに棚卸しを終え、発行サイトに依存する新規案件を2027年2月までになくす計画例が示されている。ただしこれは計画モデルで、Microsoftの正式な期限ではない。正式な期限は2027年3月1日と2028年10月1日の2つ。
  - id: sources
    title: 出典
    durationInFrames: 180
    notes: 公式の情報をまとめた。読み取り専用の範囲は今後変わる可能性があるので、自分のテナントのメッセージセンターでMC1464926を確認してほしい。
