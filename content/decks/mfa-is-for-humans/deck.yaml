slug: mfa-is-for-humans
title: MFAの"factor"は回数ではない ─ 多要素認証が人間だけを相手にしている理由
summary: Multi-Factor Authentication の factor は「認証材料の個数」ではなく「本人確認の種類」を指す。だからパスワード＋PINは2個でもMFAではなく、顔を見せるだけのWindows Hello for Businessは2要素になる。そしてシステムIDには、そもそもMFAという概念が適用されない。Microsoftが公式に「Can't perform multifactor authentication」と書く理由と、代わりに何で守るのかを整理する。
status: draft
visibility: public
createdAt: "2026-08-31"
updatedAt: "2026-08-31"
order: 111
