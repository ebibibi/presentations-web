slug: hccjp-77-arc-operations
title: サーバーが巻き戻ったとき、Azureはどうなる？ ─ Arcのエージェント・マシン構成・Policyを実機で戻してみた
summary: バックアップから復元した、スナップショットで巻き戻した。そのとき Azure Arc のエージェント、マシン構成、Azure Policy はどうなるのか。実機（Windows Server 2025）をセッション中に4日前へ巻き戻し、何が自力で戻り、何が戻らないかを測ります。持ち帰りは「復元・巻き戻しのあとに回す5つの手順」。戻し方が確立していれば、Azure Update Manager でパッチを当てるのは怖くない、というところまで。HCCJP 第77回勉強会（2026-09-11）の進行スライド。
