      質疑応答の時間です。チャットにいただいた質問にお答えしていきます。

      【画面】質問が出たら、該当するポータル画面へ戻って答えてよい。タブは開いたままにしておく。答えに詰まったら「そこは測っていません」と正直に言う（今日の趣旨に合う）。
  - id: promo-1003
    title: 【告知】10月3日、ITと音楽の文化祭やります
    durationInFrames: 300
    notes: |-
      最後に個人的な告知をさせてください。10月3日の土曜日、千葉県南柏のライブバー「ケサラ」で、胡田昌彦のITと音楽の文化祭2026というイベントをやります。前半はIT勉強会、後半は東京事変のコピーバンドでライブをやります。私はバンドのメンバーでもあります。参加は無料、connpassで募集しています。ITと音楽、両方好きな方はぜひ遊びに来てください。

