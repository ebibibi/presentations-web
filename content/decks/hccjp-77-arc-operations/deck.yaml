slides:
  - id: opening
    title: Azure Arc、便利なのはわかった。で、壊れたら？
    durationInFrames: 240
    notes: |-
      HCCJP第77回勉強会を始めます。今日のテーマは「Azure Arc、便利なのはわかった。で、壊れたら？」です。前回まででArcを使うとオンプレの管理が楽になることはお見せしました。今日はその先、本番運用に入れる前に確かめておきたいことを、実機で片っ端から試した結果をお話しします。

      【開始前の仕込み・13:50】ポータルで Update Manager の評価を arcwin01 / arclnx01 の2台にかけておく（結果が出るまで2〜4分。ここで回しておけば assess-result のスライドで即座に見せられる）。ブラウザのタブは左から［Arc マシン一覧］［arcwin01 Overview］［Update Manager］［マシン構成］［Resource Graph エクスプローラー］の順に開いておく。ターミナルは1枚、文字サイズは18pt以上（コマンド中の $SUB は export SUB=... で先に通しておく。詳細は presentations リポジトリの HCCJP_77/run-of-show.md）。
  - id: agenda
    title: 本日の流れ
    durationInFrames: 200
    notes: |-
      本日の流れです。14時5分から45分ほど私のセッション、そのあとQ&A、15時から高添さんのAdaptive Cloud最新動向、最後にクロージングという構成です。

      【画面なし】ここは口頭のみ。次の profile を出しながら、共有画面がスライドになっていることを確認する。
  - id: profile
    title: 話す人
    durationInFrames: 170
    notes: 胡田昌彦です。日本ビジネスシステムズ株式会社に所属し、Microsoft MVPを14年連続で受賞しています。HCCJPの主幹事もしています。
  - id: recap76
    title: 前回のおさらい ─ Arcで繋ぐと、ここまで楽になる
    durationInFrames: 230
    notes: |-
      前回、第76回では、オンプレのサーバーをその場で壊して、AIエージェントに直してもらいました。誰もそのサーバーにログインせず、VPNも踏み台もなしで、Azure越しに調査から復旧まで通しました。Arcで繋いでおけば、オンプレの面倒くささはかなり消える、というところまではお見せできたと思います。

      【画面・15秒】第76回のアーカイブ（https://www.youtube.com/@hccjp）のサムネイルを一瞬だけ見せて「これです」と言う。再生はしない。
  - id: the-wall
    title: でも、本番に入れるとなると
    durationInFrames: 260
    notes: ただ、そこから「じゃあ本番でも使おう」に進むには、もうひとつ越える壁があります。何かあったとき、どうなるのか。パッチを当てて壊れた、巻き戻した、復元した。そのときAzure側はどうなっているのか。ここが分からないままだと、いざというときに手が止まります。
  - id: inventory
    title: まず棚卸し ─ Arc経由で何が手に入るのか
    durationInFrames: 250
    notes: |-
      本題の前に、Arcで繋ぐと何が手に入るのかを整理します。公式は統制・保護・構成・監視の4つに分けています。エージェント1本入れるだけで、この全部が使えるようになります。

      【画面・40秒】ポータルの arcwin01 のページを開き、左メニューを上から下へゆっくりスクロールして指す。「このスライドの4分類は、実はこの左メニューそのものです」— 拡張機能／更新／マシン構成／インサイト／SSH が並んでいるのを見せる。スライドに戻る。
  - id: proof
    title: 実際に動かして確かめた
    durationInFrames: 240
    notes: |-
      一覧で見せるだけでは意味がないので、実際に動かしました。Arc経由のコマンド実行は42秒で返ってきます。マネージドIDのトークンもゲストの中から取れました。拡張機能の配布も動きます。そしてSSH。NATの内側にいる10.10.0.41のサーバーに、ポートを1つも開けずにインターネット越しでログインできました。全部、インバウンドの穴なしです。

      【デモ①・実機・2〜3分】Run Command をその場で流す。PowerShell（Windows Terminal）でそのまま貼れる形。
        ポイント: PowerShell では `--body @runcmd.json` の `@` が splatting 演算子と解釈されて ParserError になる。必ず `"@runcmd.json"` とダブルクオートで囲む。
        URL 内の `$expand` も同じ理由でシングルクオート側に置く（ダブルクオートだと空変数に展開されて消える）。

        # ① 準備（開始前に1回だけ流しておく。runcmd.json をカレントに作る）
        $SUB = az account show --query id -o tsv
        $RG = "rg-hccjp76-arc"; $M = "arclnx01"
        $body = '{"location":"japaneast","properties":{"source":{"script":"echo HOST=$(hostname); . /etc/os-release; echo OS=$PRETTY_NAME"},"asyncExecution":false,"timeoutInSeconds":90}}'
        Set-Content -Path runcmd.json -Value $body -Encoding ascii

        # ② 本番。実行のたびに名前を変える（同名を消して作り直すと Deleting で数分待たされる）
        $RC = "hccjp77-" + (Get-Date -Format HHmmss)
        $URL = "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.HybridCompute/machines/$M/runCommands/$RC" + "?api-version=2024-07-10"
        az rest --method put --url $URL --body "@runcmd.json" -o none

        # ③ 結果を取りに行く（Creating の間ポーリング。出たら output を表示）
        $GET = $URL + '&$expand=instanceView'
        foreach ($i in 1..40) { $r = az rest --method get --url $GET | ConvertFrom-Json; Write-Host "$($i*5)s $($r.properties.provisioningState)"; if ($r.properties.provisioningState -ne 'Creating') { break }; Start-Sleep 5 }
        $r.properties.instanceView.output

        HOST=arclnx01 / OS=Ubuntu 24.04.4 LTS が出れば成功。
        タイミング: ②の PUT は1秒で返る（ここで「投げた瞬間に返ってきます」と言える）。結果が出るまでは実測で約80秒。
        待っている80秒が話す時間。「インバウンドは1つも開けていません」「今このコマンドは Azure からエージェントに降りていっています」。
        ゲスト内での実行時間そのものは1秒。残りは Azure とエージェントの往復。
      ※戻ってこないときは深追いしない。スライドの数字に戻す。
  - id: update-manager
    title: Azure Update Manager ─ 同じ画面から、パッチを適用する
    durationInFrames: 230
    notes: |-
      今日の中心にあるのがAzure Update Managerです。AzureのVMもオンプレのサーバーも、同じ画面で更新プログラムの状態を評価して、メンテナンス時間を決めて、パッチを適用できます。Windows と Linux が同じ操作で扱えるのがポイントです。

      【画面・1分】ポータル ＞ Azure Update Manager ＞［マシン］。Azure VM とオンプレの arcwin01 / arclnx01 が同じ一覧に並んでいるところを見せるのがこのデモの主役。フィルターで［Arc 対応サーバー］に絞って戻す動きを1回入れると伝わる。
  - id: assess-result
    title: 【実機】評価してみた ─ WindowsはWU、LinuxはAPT
    durationInFrames: 250
    notes: |-
      実際に両方のOSで評価をかけてみました。Windowsは2分、Linuxは4分で完了しています。裏で使われているのはWindowsがWindows Update、LinuxがAPTで、Update Managerはそれぞれのネイティブな仕組みを呼んでいるだけです。面白いのはLinuxで、3件がUbuntu Proのサブスクリプションを要求するというエラーが返りました。評価はできるが当てられない。ハイブリッド運用のリアルです。

      【デモ②・開始前に仕込んだ結果を回収】Update Manager の評価結果を開き、Windows と Linux を並べて見せる。Linux の「Ubuntu Pro のサブスクリプションが必要」というエラー行を必ず指差す（ここが今日いちばん実務的な発見）。
      CLI で見せるなら（実測で動作確認済み）:
        az graph query -q "patchassessmentresources | where type =~ 'microsoft.hybridcompute/machines/patchassessmentresults' | project machine=split(id,'/')[8], status=properties.status, counts=properties.availablePatchCountByClassification" --subscriptions $SUB -o json
  - id: billing
    title: 何をすると、いくら課金されるのか
    durationInFrames: 280
    notes: |-
      課金の話を整理します。まず大事なのは、Arcに繋ぐこと自体は無料だということです。エージェントを入れて、Azureにサーバーを見えるようにして、タグを付けて、RBACで権限を切って、Resource Graphで検索して、拡張機能を配って、Run Commandを流す。ここまでは1円もかかりません。課金されるのは、その上で使うサービスです。Update Managerはサーバー1台あたり月5ドル、マシン構成は月6ドル。どちらもAzure VMなら無料で、オンプレを混ぜた瞬間に有料になります。

      【画面・30秒】ポータル ＞ コスト管理 ＞ コスト分析。粒度を［日別］、フィルターをリソースグループ rg-hccjp76-arc にして、2台で1日あたり数十円のグラフを見せる。「繋ぐだけなら0円、Update Manager を有効にした日から線が立ち上がる」と読み上げる。
  - id: hotpatch
    title: Hotpatch が、無料になっていました
    durationInFrames: 230
    notes: |-
      そしてこれはぜひ知っていただきたいのですが、2026年5月19日から、Windows Server 2025のHotpatchがArc接続マシンで追加費用ゼロになりました。GAした2025年7月時点ではコアあたり月1.5ドルの有償でしたが、per-coreのメーターごと廃止されています。再起動を減らせる選択肢が、オンプレの資産にタダで降りてきています。

      【画面・30秒】Microsoft Learn の Hotpatch の価格に関するページを開き、「2026年5月19日以降、Arc 接続マシンでは追加費用なし」の一文をカーソルで指す。一次情報を見せることが目的なので、ページを開いて指すだけでよい。
  - id: two-nets
    title: 戻す手段は二段構え
    durationInFrames: 250
    notes: |-
      ここから本題です。パッチを当てる前に、戻せる手段を用意しますよね。ここで大事なのは、チェックポイントとバックアップは役割が違うということです。チェックポイントは同じホストの同じストレージに乗るので、ホストごと死んだら一緒に消えます。速く戻せるかわりに、保険にはならない。

      【画面なし】口頭のみ。次の checkpoint-doc で公式ドキュメントを開くので、ブラウザのタブを先に選んでおく。
  - id: checkpoint-doc
    title: 「スナップショットはダメ」は半分だけ正しい
    durationInFrames: 240
    notes: |-
      よく「本番でスナップショットを使うな」と言われますが、公式ドキュメントの冒頭には、ソフトウェア更新を当てる前にチェックポイントを作るとよい、と書かれています。ダメなのはバックアップの代わりに使うことです。ただし標準チェックポイントはADのような分散レプリケーションで不整合を起こすので、本番チェックポイントを明示的に選んでください。

      【画面・30秒】Hyper-V のチェックポイントに関する Microsoft Learn のページを開き、「ソフトウェア更新を適用する前にチェックポイントを作成するとよい」の記述と、本番/標準チェックポイントの違いの節を指す。「ダメと言われているのはバックアップの代用にすることです」と重ねる。
  - id: experiment
    title: 【実験】Azureが先へ進んだあとに、ローカルだけ巻き戻す
    durationInFrames: 280
    notes: |-
      そこで実験を組みました。Arcに繋いだWindows Server 2025とUbuntuに、拡張機能と構成ポリシーを配ります。チェックポイントを取ります。その後Azure側から変更を進めます。そして巻き戻す。Azureは先に進んでいて、ローカルだけ過去に戻る。この状態で何が起きるかを測りました。

      【画面・1分】nested-lab-01（10.20.0.20）の Hyper-V マネージャーをリモートデスクトップで開く。arcwin01 / arclnx01 と、それぞれに残っているチェックポイント T1-hccjp77 を見せる。実験の舞台が本物であることを1回見せておくと、後の実測値が効く。
      ※このデモは「巻き戻しを本番でやる」のではなく、既に取ってある T1 を見せるだけ。時間があれば arcwin01 を実際に巻き戻して、result-ext の9分をタイマーで回しながら進めてもよい（上級編・進行に余裕があるときだけ）。
  - id: result-ext
    title: 【結果1】拡張機能は、自力で追いついた
    durationInFrames: 280
    notes: |-
      結果です。拡張機能は両方のOSで自動的に追いつきました。Linuxは巻き戻しから約80秒。Windowsは約9分かかり、しかも2段階でした。まず巻き戻したローカルの古い設定でそのまま1回実行し、その8分後にAzureの最新を取り直しています。つまり一時的に古い状態が復活する窓があります。

      【デモ③・実機・1分】巻き戻し後に拡張機能が追いついた証拠として、実機の marker.txt を Run Command で表示する（Windows は C:\hccjp77\marker.txt、Linux は /var/tmp/hccjp77/marker.txt）。今は T2 の内容が入っている。
      ログを見せる場合は事前に撮ったスクリーンショットを使う。「has new settings - enqueuing extension」「already installed - Not enqueuing」の2行が主役。ライブでログを掘りに行かない。
  - id: result-blind
    title: 【結果2】Azureは、巻き戻しに気づかない
    durationInFrames: 260
    notes: |-
      そしてこれが重要です。巻き戻しと再起動をまたいでも、Azureポータルのステータスは終始Connected、拡張機能はSucceededのままでした。ハートビートは5分ごと、15分途切れて初めてDisconnectedになるので、その猶予に収まってしまいます。ポータルの緑は、実機の中身を保証していません。

      【画面・40秒】ポータルの arcwin01 Overview（ステータス = Connected）と、［拡張機能］一覧（hccjp77-marker = Succeeded）を続けて見せる。「巻き戻している最中も、この画面はずっとこの色でした」と言う。ここが今日いちばんの持ち帰りポイント。
  - id: result-mc
    title: 【結果3】構成ポリシーは ─ 直るものと、直らないものがあった
    durationInFrames: 290
    notes: |-
      一方で、machine configurationには続きがあります。最初に試したタイムゾーンの構成は、ApplyAndAutoCorrectで割り当てたのに24時間以上たっても実機が変わらず、NonCompliantが記録され続けました。ここで止めれば「構成ポリシーは効かない」という結論になったのですが、切り分けをしました。同じWindowsマシンに、別のビルトイン構成、TLSの最小バージョンを設定するものを同じモードで割り当てたところ、16分でCompliantになり、実機のレジストリも実際に作られていました。つまりWindowsだからダメなのではなく、特定の構成パッケージだけが動いていない。ここは切り分けないと誤った一般化をするところでした。

      【デモ④・実機・1分】ポータル ＞ arcwin01 ＞［マシン構成］。実際に今の割り当てが並んでいる（2026-09-07 時点の実測: SetWindowsTimeZone = 非準拠 / SetSecureProtocol = 準拠 / AuditSecureProtocol = 準拠）。同じ ApplyAndAutoCorrect でも直るものと直らないものがある、を画面で見せる。
      CLI で見せるなら:
        az rest --method get --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/rg-hccjp76-arc/providers/Microsoft.HybridCompute/machines/arcwin01/providers/Microsoft.GuestConfiguration/guestConfigurationAssignments?api-version=2022-01-25"
  - id: byproducts
    title: ついでに分かったこと
    durationInFrames: 250
    notes: |-
      検証の途中で分かったことも共有します。Azure側のリソースを消すと、エージェントは自力で復帰できません。実際このラボは22日間ずっとDisconnectedのまま、トークンが取れないというエラーを出し続けていました。復旧はコマンド2つ、1分から2分です。

      【画面・20秒】事前スクリーンショットで、22日間 Disconnected だったときのエージェントのエラー（Unable to acquire token - please disconnect and reconnect）を見せる。復旧コマンド2本はスライドの文字で足りるので、ライブで切断はしない。
  - id: backup-line
    title: バックアップと復元 ─ サポート内と、その外
    durationInFrames: 260
    notes: |-
      バックアップの話もします。Microsoft純正でHyper-VのVMを丸ごと守るならMABSが必要です。そして復元先で扱いが変わります。元のVMインスタンスに戻すのは公式にworks as expected。別の場所に戻すと管理対象外のVMになり、Azure Local VMには変換できません。つまり元の場所に戻す設計にすれば、全部サポート内で回ります。

      【画面なし】口頭のみ。ここでブラウザを Resource Graph エクスプローラーのタブに切り替えておく（次の checklist で使う）。
  - id: checklist
    title: 持ち帰っていただきたい ─ 戻し方チェックリスト
    durationInFrames: 270
    notes: |-
      今日いちばん持ち帰っていただきたいのがこれです。復元や巻き戻しのあとに何を確認するか。Arcの接続状態、拡張機能が最新の設定で再適用されたか、構成ポリシーは手で是正が要るか、そしてパッチのコンプライアンス表示は再評価したか。この4つです。

      【デモ⑤・実機・1分】チェックリストの1〜2番目を、その場のクエリで確認して見せる。Resource Graph エクスプローラーに貼るクエリ（動作確認済み）:
        resources | where type =~ 'microsoft.hybridcompute/machines' | project name, status=properties.status, agent=properties.agentVersion, lastSeen=properties.lastStatusChange
      「復元したあと、この1本を流せば全台まとめて見られます」で締める。ここが今日いちばん持ち帰ってほしい実物。
  - id: conclusion
    title: だから、運用に入れていい
    durationInFrames: 260
    notes: |-
      まとめです。Arcは思ったより強い。拡張機能は自力で追いつきますし、Azure側のオブジェクトは巻き戻しでは消えません。ただし追いつくまでに時間差があり、その間ポータルは緑です。そして構成ポリシーのように追いついてこないものもある。だからこそ、戻し方を手元に持っておけば、Arcは安心して運用に入れられます。Update Managerも使っていきましょう。

      【画面なし】スライドのまま話す。ここで共有画面がポータルのままにならないよう注意。
  - id: next-session
    title: 続いて ─ Microsoft "Adaptive Cloud" 最新動向
    durationInFrames: 180
    notes: それではここからは高添さんに、Microsoft Adaptive Cloudの最新動向をお話しいただきます。高添さん、よろしくお願いします。
  - id: qa
    title: 質疑応答
    durationInFrames: 180
    notes: |-
      質疑応答の時間です。チャットにいただいた質問にお答えしていきます。

      【画面】質問が出たら、該当するポータル画面へ戻って答えてよい。タブは開いたままにしておく。答えに詰まったら「そこは測っていません」と正直に言う（今日の趣旨に合う）。
  - id: promo-1003
    title: 【告知】10月3日、ITと音楽の文化祭やります
    durationInFrames: 300
    notes: |-
      最後に個人的な告知をさせてください。10月3日の土曜日、千葉県南柏のライブバー「ケサラ」で、胡田昌彦のITと音楽の文化祭2026というイベントをやります。前半はIT勉強会、後半は東京事変のコピーバンドでライブをやります。私はバンドのメンバーでもあります。参加は無料、connpassで募集しています。ITと音楽、両方好きな方はぜひ遊びに来てください。

      【画面・20秒】connpass のイベントページを開いて見せる。QRコードをスライドに出しているなら、読み取り時間として5秒静止する。
  - id: closing
    title: ありがとうございました
    durationInFrames: 200
    notes: |-
      本日はご参加ありがとうございました。次回は10月9日、第2金曜日の14時からです。またお会いしましょう。

      【画面】最後に hccjp.org（https://www.hccjp.org/）を開き、次回10月9日の枠と過去回アーカイブを見せてから配信を終える。
