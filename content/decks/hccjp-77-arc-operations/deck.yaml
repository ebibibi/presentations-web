  - id: closing
    title: ありがとうございました
    durationInFrames: 200
    notes: |-
      本日はご参加ありがとうございました。次回は10月9日、第2金曜日の14時からです。またお会いしましょう。

      【画面】最後に hccjp.org（https://www.hccjp.org/）を開き、次回10月9日の枠と過去回アーカイブを見せてから配信を終える。
