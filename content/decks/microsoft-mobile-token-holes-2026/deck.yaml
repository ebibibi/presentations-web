slug: microsoft-mobile-token-holes-2026
title: スマホのMicrosoftアプリ、2026年に4回「サインインを横取りされる穴」｜利用者がやることは4つ
summary: 2026年、Microsoft Authenticator と Office 系の Android アプリで、ほかのアプリや偽の要求にサインイン情報やトークンを渡してしまう脆弱性が4回続きました。3月の CVE-2026-26123（QRコード・サインインリンクの横取り）、5月の CVE-2026-41615（承認させたトークンを外へ送らせる）、5月に修正され6月に公開された Office 系6アプリのデバッグフラグ消し忘れ（FlagLeft、CVE-2026-41100 ほか）、9月の CVE-2026-80097（偽 Teams にトークンを渡した AuthMask）です。4件それぞれの仕組み、共通点、安全なバージョン、そして利用者がやる4つと管理者がやることをまとめます。
status: draft
visibility: public
canvas: standard
createdAt: "2026-10-28"
updatedAt: "2026-10-28"
tags:
