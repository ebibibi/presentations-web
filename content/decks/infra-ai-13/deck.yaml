slug: infra-ai-13
title: インフラエンジニアの業務13項目、全部AIにやらせています
summary: 「インフラはAIには無理」という主張とともに、実務レベルのインフラエンジニアの業務13項目が並んだリストが広く共有された。ポータルもコマンドも自分では触らず、13項目すべてをAIにやらせている立場から答える。議論が噛み合わないのは「AIでできる」に3つの層が混ざっているからで、手を動かす／案を出す／判断まで持つ、を分けると13項目の地図が引ける。AIが触れない項目はゼロ、完全に任せられないのは可用性とお金に絡む3つだけ。そして元の投稿者自身が後から「エンジニアならできて当然」と言い直しており、争点はすでに「誰がやればできるか」へ移っている。
status: draft
visibility: public
canvas: standard
createdAt: "2026-09-21"
updatedAt: "2026-09-21"
