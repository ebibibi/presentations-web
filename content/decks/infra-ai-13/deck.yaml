slug: infra-ai-13
title: インフラエンジニアの業務13項目、全部AIにやらせています
summary: 「インフラはAIには無理」という主張とともに、実務レベルのインフラエンジニアの業務13項目が並んだリストが広く共有された。実際に13項目すべてをAIにやらせている立場から答える。議論が噛み合わないのは「AIでできる」に3つの層が混ざっているからで、手を動かす／案を出す／判断まで持つ、を分けると13項目の地図が引ける。触れない項目はゼロ、判断まで渡せるのは3つ。
status: draft
visibility: public
canvas: standard
createdAt: "2026-09-21"
updatedAt: "2026-09-21"
tags:
