slides:
  - id: opening
    title: 13項目、全部やらせています
    durationInFrames: 210
    notes: 先日Xで、「インフラはAIでできると言っている人がいるが、実務レベルのインフラエンジニアの業務はこれだ」という13項目のリストが回ってきました。結論から言います。私、この13個、全部AIにやらせています。ただし、この話はそこで終わりません。むしろここからが本題です。
  - id: profile
    title: 解説する人：胡田 昌彦
    durationInFrames: 170
    notes: 胡田昌彦です。Microsoft MVPを14年連続で受賞しています。Windows Server、Azure、Azure Hybridが専門で、いまは生成AIを実際の運用に組み込む仕事をしています。今日の話は、意見ではなく、毎日やっていることの報告です。
  - id: the-list
    title: 回ってきた13項目
    durationInFrames: 260
    notes: これが元のリストです。アカウント設計とIAM、ネットワーク、実行基盤、状態を持つミドルウェア、IaCと変更管理、シークレットと証明書、オブザーバビリティ、キャパシティ設計、バックアップとDR、SLOと障害対応、コスト管理、コンプライアンス、そして本番障害の切り分けと復旧判断。よくできたリストだと思います。実務を知っている人が書いています。だからこそ、これを土台に話すのが一番早い。
  - id: my-reply
    title: 私はこう答えました
    durationInFrames: 240
    notes: これが実際の投稿です。それ丸ごとできるけどな、私やらせてるけど。ただし、何も知らない人間ができるとは思わないけども。「AIでできる」の解像度を高めないと議論に乗らないかなあ、と。この後半が今日の中身です。できる・できないの二択で話している限り、この議論は永久に終わりません。
  - id: how-i-work
    title: 自分では、もう触っていません
    durationInFrames: 230
    notes: 先に私の作業のやり方を言っておきます。私は、ポータル画面を自分で触ったり、コマンドを自分で打ったりというのを、もう完全にしていません。やってほしいことをAIに伝えて、やってもらうスタイルです。だから13項目を全部やらせている、という言い方になります。これは未来の見通しの話ではなく、今日そうやって仕事をしているという報告です。
  - id: section-resolution
    title: 「AIでできる」の解像度を上げる
    durationInFrames: 130
    notes: ここから、解像度の話をします。
  - id: three-levels
    title: 「できる」には3つの層がある
    durationInFrames: 270
    notes: 私の整理では、少なくとも3つの層があります。レベル1、AIが手を動かす。設計と判断は人間がやって、作業だけ渡す。レベル2、AIが設計案を出す。選択肢と根拠を出させて、人間が選ぶ。レベル3、AIが判断まで持つ。人間は結果だけ見る。この3つはまったく別の話なのに、同じ「AIでできる」という言葉で語られています。
  - id: why-not-aligned
    title: 議論が噛み合わない理由
    durationInFrames: 250
    notes: なぜ話が噛み合わないのか。できる派はレベル1やレベル2を指して「できる」と言っています。無理派はレベル3を指して「無理」と言っています。どちらも正しい。指しているものが違うだけです。だから「AIでインフラはできますか」という問いは、そのままでは答えられない。レベルを添えないと質問として成立していない、というのが私の立場です。
  - id: mapped
    title: 13項目を、3つの層に置き直す
    durationInFrames: 320
    notes: では実際に13項目を置き直します。これは私の現時点での運用実感です。レベル3、完全に任せているのが10項目。アカウント設計とIAM、ネットワーク、実行基盤、状態を持つ基盤、IaCと変更管理、シークレットと証明書、オブザーバビリティ、キャパシティと性能、バックアップとDR、コンプライアンス。レベル2、AIに案を出させて人間が決めるのが3つ。SLOと可用性設計、コスト管理、本番障害の復旧判断です。そしてレベル1、手だけ借りて設計も判断も人間、という項目はゼロ。私の手元にはもう残っていません。
  - id: the-punchline
    title: 完全に任せられないのは3つだけ
    durationInFrames: 260
    notes: 数えるとこうなります。AIが一切触れない項目は、13個のうちゼロ。完全に任せているのが10個。人間が決めているのは3個だけです。そしてその3個は、可用性とお金に絡むもの。技術的に難しいから人間がやっているのではなくて、事業としてどこまで止まっていいか、いくら払うかを決める話だから人間がやっています。
  - id: goalpost
    title: 争点は、すでに動いている
    durationInFrames: 260
    notes: ここで面白いことが起きました。元の投稿をした方が、後からこう書いています。非エンジニアが開発のようにパッとAIに指示を出してできることはない、ということを言っています。エンジニア経験が長いのであれば、これくらいはAIを使ってできるのは当然なのでは、と。最初は「インフラはAIオンリーでは厳しい」でした。それが「エンジニアならAIでできて当然」になっています。争点は「AIにできるか」から「誰がやればできるか」へ移っていて、これは私が最初の返信で書いた「何も知らない人間ができるとは思わない」と同じ場所です。つまり、解像度を上げれば意見はかなり近い。
  - id: what-humans-keep
    title: 人間が決めているもの
    durationInFrames: 270
    notes: 人間が決めている3つを見ると、共通点があります。SLOと可用性設計は、どれだけの停止を許容するかという事業の判断です。設計案そのものはAIが出せますが、どこに線を引くかは人間が決める。コスト管理も同じで、いくら払うかはお金の判断です。復旧判断は、切り分けはAIのほうが速いのに、止めるか戻すかは可用性に直結する。つまり残っているのは、技術的に難しいことではなく、可用性とお金という事業の判断です。
  - id: precedent
    title: プログラマーで起きたことが、起きる
    durationInFrames: 260
    notes: もう一つ言っておきたいことがあります。プログラマーも、AIがプログラムを書くなんて、と言っていました。今はもう、AIに任せていますという人がかなり増えています。インフラだろうと何だろうと、AIが手出しできる領域はいずれそうなります。クラウドはもうそうなってきていますし、オンプレも時間の問題だと思っています。その移動は下の層から起きていて、私の手元ではレベル1がもう空になりました。
  - id: why-it-moves
    title: 整備する動機は、運営元が一番持っている
    durationInFrames: 280
    notes: なぜ境目が動くと言えるのか。必要なものは見えています。スキル集と、AIが読みやすいドキュメントと、典型的なパターンを網羅したリファレンスアーキテクチャ。これがあれば、「やりたいことはこれ」と言うだけで、今のAIの性能でも適切に選んで構築してくれます。では、それを整備するモチベーションが誰に一番あるかというと、そのクラウドを運営しているメガテック自身です。運営元がAIも駆使しながら競い合って、「AIが使いやすいクラウド」にしていく。同時に、クラウド自体へのAI組み込みも進みます。そしてこれはAWSやGCPやAzureだけの話ではなく、M365やGoogle Workspaceも同じで、APIで触れるものすべてに当てはまります。
  - id: each-site-its-era
    title: 現場ごとに、違う「時代」がある
    durationInFrames: 260
    notes: ただし、現場でアプリからインフラまで全部がAIで実現されるまでには、特にレガシーアプリの問題が大きくて、ものすごく時間がかかるのも事実です。メインフレームもCOBOLもまだ現役ですからね。そういう意味では、「現場」ごとに異なる「時代」があって、自分に合った現場、つまり自分に合った時代で仕事ができるのかもしれない。AIに全部仕事が奪われるという話には、すぐにはならないと思います。エンジニアとしては、なるべく最先端のことをわかった上で、幅広い時代や流儀に合わせられる人、現場に時代をまたぐ変化を起こせる人が重宝されるだろうなと思います。
  - id: management
    title: 経営から見ると、これは採用の話ではない
    durationInFrames: 280
    notes: 経営の話に落とします。インフラ人材が採れない、という相談をよく受けます。でも本当の問題はたいていそこではありません。AIに任せられる層と、任せてはいけない層の境目を、社内の誰も言語化できていない。これが本当の形です。境目が引けていないから、全部人間でやるか、全部AIに丸投げするかの二択になる。どちらも失敗します。今日の3つの層は、その境目を引くための道具として使ってください。
  - id: recap
    title: today's takeaway
    durationInFrames: 220
    notes: まとめます。1つ、「AIでできる」には手を動かす、案を出す、判断まで持つ、の3層がある。2つ、13項目のうちAIが触れない項目はゼロ、完全に任せられないのは3つ。3つ、人間が決めているのは可用性とお金で、技術的な難しさの話ではない。4つ、争点はすでに「AIにできるか」から「誰がやればできるか」へ移っている。5つ、自社でこの境目を引けているかどうかが、AI活用の分かれ目になります。
  - id: sources
    title: 出典
    durationInFrames: 170
    notes: 出典です。元の13項目のリストと、私の返信はどちらもXの公開投稿です。概要欄にリンクを置いておきます。
  - id: cta
    title: CTA
    durationInFrames: 240
    notes: 収録用カンペはこの後ろのスライドにあります。
