slug: data-leak-design-for-leaks
title: 情報漏洩は防げない。漏れても大丈夫な設計に変えるしかない
summary: 情報漏洩はAIの攻撃で急に増えたのではなく、昔から起きていて気づいていないだけ、というのが私の見方です。隠し通す発想には限界があるので、持たない・暗号化する・パスワードをやめる・いつでも戻せる状態にする、そしてクラウドの仕組みと保険で被害を限定する。「漏れる前提」で組み立て直す考え方を整理します。
