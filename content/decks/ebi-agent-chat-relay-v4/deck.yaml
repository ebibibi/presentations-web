slug: ebi-agent-chat-relay-v4
title: AIエージェントをTeamsへ——Ebi Agent Chat Relay v4
summary: DiscordとMicrosoft Teamsのどちらからでも、Claude Code CLI、OpenAI Codex CLI、local OpenAI-compatible /v1/responses、AG-UI HTTP/SSEを使うための構造を解説する。Teamsの公開受け口とprivate agent hostを分離する理由、導入ガイドの8セクション、データ境界、v4の既知制約までを扱う。
