  - security
slides:
  - id: opening
    title: MFAをかけられない機器をどう守るか
    durationInFrames: 200
    notes: MFAを全社に展開すると、必ず「人がいないので承認できない」機器が残ります。会議室のTeams Rooms、サイネージ、共有端末。ここで多くの組織が除外グループへ放り込んで終わりにします。でも実は、この領域にはMicrosoftの明確な公式設計があります。今日はそれを見ていきます。
  - id: profile
    title: 解説する人：胡田 昌彦
    durationInFrames: 190
    notes: 解説する胡田昌彦です。Microsoft MVPを14年連続で受賞し、Windows、Azure、Microsoft 365を実機で検証してきました。今日は運用で必ず詰まる、この一点だけを扱います。
  - id: the-question
    title: 3つの質問は、同じ場所に帰着する
    durationInFrames: 240
    notes: 現場でよく聞かれるのはこの三つです。MFAをかけられないIDはどうする。ROPCを使っている奴がいる。デバイスコードフローを止めたい。別々の話に見えますが、実務で掘っていくと、答えの多くが同じ一箇所に集まります。会議室端末などのリソースアカウントです。今日はそこを軸に、三つをまとめて解きます。
  - id: section-what
    title: SECTION 1 ─ そもそも、何が置かれているのか
    durationInFrames: 150
    notes: 最初のセクションです。会議室端末が使っているIDの正体を押さえます。
  - id: resource-account
    title: リソースアカウントの正体
    durationInFrames: 250
    notes: Teams Roomsが使っているのはリソースアカウントです。実体はMicrosoft Entraのアカウントに、Exchangeのリソースメールボックスを紐づけたもの。つまりディレクトリ上はユーザーオブジェクトです。ただし人ではありません。管理者が集中管理し、エンドユーザーはサインインもサインアウトもできません。Windows版はShell Launcher V2でロックダウンされていて、Teams Roomsアプリだけがそのアカウントを知っています。Windows自身は知りません。これが後で効いてきます。
  - id: not-a-failure
    title: これは、運用の失敗ではない
    durationInFrames: 225
    notes: 大事な前提です。リソースアカウントが存在すること自体は、ID管理ができていないという意味ではありません。製品がそう作られているからです。IDの分類が完璧にできている組織でも、Teams Roomsを入れれば必ずこれが生まれます。だから「無くす」のではなく「守り方を決める」のが正解になります。
  - id: section-mfa
    title: SECTION 2 ─ 公式は「MFAをかけるな」と書いている
    durationInFrames: 150
    notes: 二つ目のセクションです。ここが一番誤解されているところです。
  - id: dont-mfa
    title: 公式が「MFAをかけるな」と書くID
    durationInFrames: 265
    notes: Microsoftはこう書いています。Teams Roomsのリソースアカウントは、対話型の多要素認証、スマートカード認証、クライアント証明書認証を構成すべきではない。理由も明記されています。リソースアカウントには、MFAの要求を承認するための第2のデバイスが無いからです。条件付きアクセスのサポート表でも裏づけられます。Rooms on WindowsはRequire multifactor authenticationがそもそも非サポート。Android版は技術的にはサポートですが、シームレスなサインインのために強制するな、別の第2要素を使え、と注記されています。認証強度は両方とも非サポートで、FIDO2セキュリティキーも使えません。
  - id: also-block
    title: サインイン中に操作を求めるものは全部だめ
    durationInFrames: 230
    notes: もう一つ、見落とされがちな注意があります。公式には、Teamsデバイスのリソースアカウントは、サインインフロー中に何らかの操作を要求するポリシーからも除外すべきだ、と書かれています。たとえばセルフサービスパスワードリセットの認証方法登録の促しです。Teamsデバイスは登録のプロンプトに対応していないので、サインインがブロックされます。MFAだけ除外して安心していると、ここで止まります。
  - id: section-how
    title: SECTION 3 ─ では、何で守るのか
    durationInFrames: 150
    notes: 三つ目のセクションです。MFAが使えないなら、代わりに何を置くのか。公式の答えがあります。
  - id: two-factors
    title: 公式の代替は「二要素相当を別の材料で作る」
    durationInFrames: 255
    notes: 公式の言い方が本質を突いています。人がいないデバイスに対しては、知っているもの、持っているもの、体の特徴のうち、少なくとも二つを満たす代替手段を使うべきである。つまりMFAという実装を諦めるのであって、多要素という考え方は捨てない。具体的には、準拠デバイスと既知のネットワーク場所を使え、と書かれています。パスワードは知っているもの。管理された特定の端末であることは、持っているものに相当します。
  - id: example-policy
    title: 公式のサンプルポリシー
    durationInFrames: 250
    notes: 公式が示しているポリシーの形はこうです。まず対象は、リソースアカウントだけを集めた専用グループ。対象リソースはOffice 365、Exchange Online、Teams、SharePoint Onlineに限定し、それ以外へのサインインは拒否。認証はモダン認証のみでレガシー認証はブロック。デバイスプラットフォームはWindowsまたはAndroid。そして既知の信頼された場所から、かつ準拠デバイスであること。これらを全部満たしたうえで、正しいユーザー名とパスワードがあって初めてサインインできる、という設計です。
  - id: separate-policy
    title: 既存ポリシーからは「全部除外」して専用を作る
    durationInFrames: 235
    notes: 運用の作法も明記されています。Teams Roomsのリソースアカウントは、既存の条件付きアクセスポリシーからすべて除外し、リソースアカファウント専用の新しいポリシーを作る。そして命名規則を決めて、動的グループで自動的に集める。たとえば mtr- という接頭辞を付けておけば、新しい会議室が増えても勝手にポリシーの対象になります。除外リストを手で育てるのではなく、命名で自動化する。ここが実務の差になります。
  - id: intune-required
    title: Windows版は、Intune登録が必須
    durationInFrames: 240
    notes: 一つ技術的な前提があります。さきほど、Windows自身はリソースアカウントを知らない、と言いました。そのままではデバイス単位の条件付きアクセスが評価できません。そこでTeams Rooms on WindowsをIntuneに登録します。登録するとTeams RoomsアプリがWindowsの登録済みアカウントをWeb account manager経由で使い、デバイスの準拠状態を条件付きアクセスへ送れるようになります。つまり準拠デバイス条件を使いたいなら、Intune登録が前提条件です。
  - id: section-flows
    title: SECTION 4 ─ ROPCとデバイスコードフローの正体
    durationInFrames: 150
    notes: 四つ目のセクションです。ここで冒頭の三つの質問が、きれいにつながります。
  - id: ropc
    title: ROPC ─ パスワードをアプリに直接渡す方式
    durationInFrames: 240
    notes: まずROPCです。アプリにIDとパスワードを直接渡してサインインさせる古い方式で、ブラウザーが出てこないため多要素認証を差し込む場所がありません。Microsoft自身が、この方式は使わないことを推奨する、多要素認証と互換性がない、と警告しています。そして重要な注意です。いわゆるレガシー認証のブロックとは別物です。条件付きアクセスのレガシー認証、Other clientsの定義は、SMTPやIMAP4、POP3、Exchange Web Servicesといったメール系プロトコルの一覧で、ROPCは含まれていません。レガシー認証をブロックしたからROPCも大丈夫、とは言えません。
  - id: mtr-uses-ropc
    title: そしてTeams Rooms on Windowsは、設計上ROPCを使う
    durationInFrames: 260
    notes: ここが今日の一番の発見だと思います。公式にこう書かれています。Teams Rooms on Windowsの認証は利用者の介在を必要とせず、対話型の第2要素認証をサポートしない。そのモダン認証の仕組みは、OAuth 2.0のリソースオーナーパスワードクレデンシャル、つまりROPCの認可付与タイプを使う。設計上そうなっている、ということです。だから「ROPCを使っている奴がいる」を調べていくと、その多くがTeams Roomsだった、という話が実際に起きます。そしてROPCを全面的に止める施策は、Teams Roomsを止めることと同義になります。
  - id: device-code
    title: デバイスコードフロー ─ Androidの Teamsデバイスが使う
    durationInFrames: 250
    notes: もう一つがデバイスコードフローです。画面に出たコードを別の端末で入力する方式で、攻撃者が自分でコードを発行して利用者に入力させるフィッシングに使われるため、Microsoftは可能な限りブロックすることを勧めています。ただしTeamsデバイスは、初回登録、再プロビジョニング、そして一部の再認証でこれを使います。しかもサポート表では、Android版のTeamsデバイスに対して認証フロー条件そのものが非サポート、デバイスコードフローをブロックするな、と明記されています。ここでも同じ構図です。全面ブロックはTeamsデバイスを止めます。
  - id: exception-scope
    title: 例外の粒度は「機器」ではなく「アカウント」
    durationInFrames: 260
    notes: では例外をどう切るか。条件付きアクセスにはデバイスフィルターがあり、デバイスIDや拡張属性で特定の端末を指定できます。ただし効くのはMicrosoft Entraに登録済みのデバイスだけで、未登録のデバイスは属性がすべて空として扱われ、等しいといった肯定の条件は一致しません。そして公式にはっきり書かれています。例外はアカウント単位であり、一つのリソースやシナリオだけに絞る方法は無い、と。除外されたアカウントは、そのポリシーの範囲内であればどのアプリに対してもデバイスコードフローを使えてしまいます。だから例外グループのメンバーは、本物のTeamsデバイスのリソースアカウントだけに限定し、監視し、所有者の承認を取る。これが公式の言い方です。
  - id: exception-design
    title: 例外設計は「永続グループ ＋ DRS除外」
    durationInFrames: 250
    notes: 具体的な設計はこうです。既定でデバイスコードフローをブロックするポリシーを一つ作り、二層の例外を置きます。一層目はTeamsデバイスのリソースアカウントを集めた永続的なセキュリティグループ。二層目は、承認済みの非Teams用途があればその専用グループ。そして対象リソースからDevice Registration Serviceを除外します。これをやらないとデバイス登録自体がブロックされます。ここで大事なのが、この例外は期限付きではなく永続だということ。Teamsデバイスは初回だけでなく、パスワード変更や条件付きアクセスポリシーの変更のたびに再認証でデバイスコードフローを使うからです。
  - id: report-only-trap
    title: 落とし穴：レポート専用モードの「該当なし」
    durationInFrames: 255
    notes: 有効化の前に必ず踏む落とし穴です。レポート専用モードで様子を見るのは正しい手順ですが、評価期間中にサインインもトークン要求もしなかったIDは、そもそも結果に現れません。だから該当ゼロに見えます。もう一つ、有効化しても一斉には止まりません。条件付きアクセスはトークン要求のたびに評価され、既定のアクセストークンは1時間、継続的アクセス評価に対応したセッションは最大28時間有効です。さらにポリシーやグループの変更がリソース側へ届くまで最大24時間かかることがあります。つまり止まるのは次のトークン要求のときから順に。数日かけて出てきます。
  - id: section-next
    title: SECTION 5 ─ そして、パスワードを消せる
    durationInFrames: 150
    notes: 最後のセクションです。ここまでの設計で残る、唯一の現実的なリスクに手を打てるようになりました。
  - id: remaining-risk
    title: 残る唯一のリスクは、パスワード漏えい
    durationInFrames: 235
    notes: ここまで見てきた設計で守れるものと、守れないものを整理します。MFAが使えない以上、リソースアカウントはIDとパスワードでサインインします。だからパスワードが漏れると、条件付きアクセスが効かない経路や場所からサインインされる可能性が残る。条件付きアクセスが唯一の防御線になっているのはそのためです。しかも困ったことに、IntuneのパスワードポリシーはTeams Rooms on Windowsでは非サポートです。ローカルのSkypeアカウントの自動サインインを妨げるからです。つまりパスワードの強度を製品側で強制する手段がありません。
  - id: passwordless
    title: 2026年、パスワードを消せるようになった
    durationInFrames: 265
    notes: そこで新しい選択肢です。Teams共有デバイスのリソースアカウントを、パスワードレスへ移行できるようになりました。保存されたユーザー名とパスワードの代わりに、デバイスに紐づいた安全な資格情報でサインインします。トークンはWindowsではTPM、AndroidではKeystoreに保管され、他のデバイスへ移せません。移行後はパスワードを削除するか、複雑なものへ変更して誰も知らない状態にできます。しかもパスワードを変更してもデバイスはサインアウトしません。公式は、仕組みとしてはWindows Hello for Businessに近い、と説明しています。
  - id: passwordless-caveats
    title: ただし、前提は重い
    durationInFrames: 250
    notes: 正直に条件も言います。Teams Roomsのライセンスが必要で、デバイスとアカウントがPro Management Portalに見えている必要があります。Teams Rooms on Windowsは、Windows 11の24H2以降かつEntra参加。ハイブリッド参加は非対応です。移行は管理者が手動で開始する必要があり、新規デバイスをいきなりパスワードレスで展開することはまだできません。まずパスワードで展開してから移行します。デバイスを初期化したり手動でサインアウトすると資格情報は失われ、もう一度パスワードから始めることになります。Crestron製のWindowsデバイスは現時点で非互換です。
  - id: recap
    title: 覚えるのは、この3つ
    durationInFrames: 225
    notes: まとめます。一つ目、会議室端末のリソースアカウントにMFAをかけないのは妥協ではなく、Microsoftの公式設計です。二つ目、代わりに準拠デバイスと既知の場所で二要素相当を作り、専用のポリシーを当てる。除外グループに放り込むのとは別物です。三つ目、ROPCとデバイスコードフローはTeams Roomsが正規に使っている方式なので、全面ブロックは製品を止めることと同義。例外はアカウント単位で永続的に管理します。そしてパスワードレス化が、最後に残るリスクへの答えになります。
  - id: related-decks
    title: 関連するスライド
    durationInFrames: 210
    notes: 今日の話と対になるスライドを二つ置いてあります。一つは、サービスIDの棚卸しと移行。人のIDで動いている自動化を見つけて、マネージドIDやワークロードIDへ移す話です。もう一つは、フィッシング耐性のあるMFAとは何か。人に対してどうMFAをかけるかの話です。
  - id: related-videos
    title: 関連する解説動画
    durationInFrames: 205
    notes: 用語をもっと基礎から知りたい方向けの動画です。認証パターンの全体像、条件付きアクセスの除外の挙動、アプリ登録の基礎。
  - id: ebistudy
    title: 体系的に、順番に学びたい方へ
    durationInFrames: 195
    notes: 続けて体系的に学びたい方向けに、Ebi StudyでMicrosoft資格、Windows Server、Azure、Claude Codeの動画講座を提供しています。ID関連は、アカウントとテナントの基礎、Entra ID認証と自動化、証明書の3コースが揃っています。月額990円です。
  - id: sources
    title: 出典
    durationInFrames: 205
    notes: 今日の内容の一次資料です。Teams Rooms on Windowsの認証、Teams Roomsの条件付きアクセスのベストプラクティスとサポート表、Teamsデバイスのデバイスコードフロー制限、そしてパスワードレスリソースアカウントのドキュメントです。
  - id: thanks
    title: ご視聴ありがとうございました！
    durationInFrames: 190
    notes: 最後までご視聴いただき、ありがとうございました。役に立ったら高評価とチャンネル登録をお願いします。これからもWindows、Azure、Microsoft 365、生成AIの難しいテーマを分かりやすく解説していきます。
