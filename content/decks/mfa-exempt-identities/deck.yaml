slug: mfa-exempt-identities
title: MFAをかけられない機器をどう守るか ─ Teams Rooms・ROPC・デバイスコードフロー
summary: 会議室端末のように人がいないデバイスには、Microsoftが公式に「MFAをかけるな」と書いている。ではどう守るのか。準拠デバイスと既知の場所で二要素相当を作る設計、Teams Roomsが設計上ROPCとデバイスコードフローを使う事実、例外の粒度、そしてパスワードを消せるようになった話まで。
status: draft
visibility: public
createdAt: "2026-08-29"
updatedAt: "2026-08-29"
order: 110
tags:
  - entra-id
  - mfa
  - conditional-access
  - teams-rooms
