slug: phishing-training-is-theater
title: 標的型メール訓練はもう通用しない ─ 「気づいて報告」より先にフィッシング耐性のある認証を強制せよ
summary: 巧妙な標的型攻撃は、人間が気づけないから成立します。「怪しいと思ったら報告」「報告しなかったらトレーニング」という運用は、守っているふりにしかなりません。約2万人を8か月追った研究と英国NCSCの指針を根拠に、訓練と報告の限界、M365の標準機能でできる報告の形、そして本当に先にやるべきフィッシング耐性のある認証の強制を整理します。
status: draft
visibility: public
canvas: standard
createdAt: "2026-10-23"
updatedAt: "2026-10-23"
tags:
  - microsoft
  - security
  - entra-id
