slug: ai-overwork-2026
title: AIと働きすぎて、体を壊しかけた｜指示は週690件、夜9時台が一番多かった
summary: AIエージェントを並列で走らせ、気づけば週690件の指示を出し、夜9時台が1日でいちばん話しかける時間になっていました。朝の血圧は上がり続け、胸の痛みで受診。「痛かったらすぐ救急車」と言われました。自分の作業ログと血圧の記録を並べて、何が詰まっていたのか、AIを止めずに人間の確認だけを減らす流れにどう作り直すのかを、包み隠さず話します。
