  title: "AIエージェントを並列で回して血圧160/109に｜週690件の指示・夜9時台が最多 ─ AIは疲れない、疲れるのは自分だった"
  publishedAt: "2026-11-21"
slides:
  - id: opening
    title: AIと働きすぎて、体を壊しかけた
    durationInFrames: 300
    notes: |-
      最初に言い切る。AIエージェントを並列で回して、指示は多い週で690件。夜9時台が1日でいちばん多い時間になっていた。
      朝の血圧はその週に143.8/96.5まで上がり、胸の痛みと頭痛で受診。先生には「胸が痛かったらすぐ救急車を呼んで」と言われた。
      今日はその数字を全部出して、何が詰まっていたか、どう直すかを話す。AIをやめる話ではない。
  - id: confession
    title: AIは疲れない。疲れるのは自分だった
    durationInFrames: 240
    notes: |-
      自分への反省として話す。AIは何十本並べても疲れない。でもAIが「確認して」「決めて」と返してくるたびに、それを受け止めるのは自分1人。
      寝る前に「あと1件だけ」と指示を出し、返事が来るとまた見てしまう。それを毎晩やっていた。
      これは医療の話ではなく、自分の働き方の記録。体のことは医師の判断に従っている。
  - id: timeline
    title: 何が起きたか
    durationInFrames: 300
    notes: |-
      10月にAIの作業を1つの画面でまとめて回す仕組み（自作のEbi AI Console）を本格的に使い始めた。並列で回せるので楽しくて、どんどん投げた。
      11/9の週に指示が690件、そのうち夜9時〜朝5時が185件。
      11/17に胸の痛みと頭痛があり受診。病院で測った血圧は160/109。心電図と採血をして、降圧薬を処方された。「胸が痛かったらすぐ救急車」。
      11/20にもう一度受診し、降圧薬1か月分と、眠れないことを相談して睡眠薬も出た。
  - id: chart-load
    title: 指示の数と、朝の血圧
    durationInFrames: 300
    notes: |-
      上が週ごとの指示の数、下が朝（4〜10時）の血圧の週平均。同じ週で並べている。
      10月前半は131〜135/88前後。指示が690件まで増えた11/9の週に143.8/96.5。11/16の週は144.9/93.3（11/17の夕方から服薬開始）。
      相関を言うにはデータが少ないし、季節で冬は上がる。それでも自分の中では、ここが一番こたえた。
      10/26の週は測定が3回しかない。11/16の週は進行中（11/21まで）。
  - id: bp-app
    title: 血圧計アプリの記録（10月と11月）
    durationInFrames: 240
    notes: |-
      血圧計アプリの月表示をそのまま見せる。左が10月、右が11月（21日まで）。
      10月の平均は132/87、11月は141/92。グラフの線が、まるごと上にずれている。
      11月の最高は157/96、下が一番高かった日は153/107。11/17の夕方から降圧薬を飲み始めている。
  - id: chart-hours
    title: 夜9時台が、いちばん多い
    durationInFrames: 300
    notes: |-
      直近4週間、何時にAIへ話しかけたか。日中は各時間100件前後なのに、21時台が171件で1日の最多。22時台155、23時台100、0時台も38。
      最後のメッセージが0時を回った日は4週間で9日あった。
      家のことが終わってから「さあ自分の時間」とAIを回し始め、そのまま寝る直前まで続けていた。
  - id: chart-flow
    title: 入る件数が、終わる件数を超えていた
    durationInFrames: 300
    notes: |-
      新しく始まった仕事（スレッド）と、完了を確定した仕事の週ごとの数。10/26の週から4週間で、入ったのが681件、終わったのが437件。
      AIは仕事を「終わったと思います」と言ってくれるが、確定するのは人間。そこが追いつかず、未完了が398件、返事待ちの判断カードが47件たまった。
      たまっていること自体が、夜にまた画面を開く理由になっていた。
  - id: section-why
    title: なぜこうなったか
    durationInFrames: 180
    notes: |-
      ここから原因と直し方。結論を先に言うと、AIは並列なのに、確認する人間が1本の列だった。
  - id: bottleneck
    title: AIは並列、確認は1列
    durationInFrames: 300
    notes: |-
      仕事が入る → AIが実行 → 人間が確認 → 完了。AIの部分は何十本でも同時に動く。でも「確認」の箱は自分1人。
      しかも確認には、終わったかの判断、AIからの質問への回答、定期ジョブの報告を読む、が全部混ざっていた。
      AIを増やすほど、この1列に並ぶ件数が増える。忙しくなると、ここから溢れる。
  - id: not-brakes
    title: ブレーキではなく、流れを直す
    durationInFrames: 360
    notes: |-
      最初、AIに相談したら「夜9時以降は使わない」「週15時間まで」と言われた。でもそれは違うと思った。
      夜に指示を出しておけば、寝ている間にAIが進めてくれて翌日が楽になる。止めたいのはAIではなく、自分が確認のために起きていること。
      だから、人間の確認を通らなくても完了していく流れを作る。右側がこれからやること。
  - id: night-order
    title: 寝る前に出す指示の型
    durationInFrames: 300
    notes: |-
      寝る前に1回だけ、朝まで人間を呼ばずに進められる指示を出す。ゴール、やっていいこと、迷ったときの決め方、止まる条件、朝に何を見せるか。
      ポイントは「迷ったら推奨案で進めて、朝に理由を書いておいて」と先に決めておくこと。そうすると夜中に質問が飛んでこない。
      朝は1枚のまとめだけ見る。
  - id: checklist
    title: 自分の数字を見てみる
    durationInFrames: 300
    notes: |-
      AIエージェントを使い始めて忙しくなった人へ。自分の数字を1回見てほしい。
      週に何件指示しているか。何時台がいちばん多いか。入る件数と終わる件数、どちらが多いか。そして血圧。
      私は家に血圧計があって毎朝測っていたから、数字で気づけた。気づいても止まれなかったのが反省点。
      体の症状があれば、仕組みより先に病院へ。
  - id: closing
    title: チャンネル登録・関連リンク
    durationInFrames: 240
    notes: 共通のCTA。
