slug: personal-data-leak-response
title: 自分の情報が漏れたら、まず何をする？【パスワードを使わない対策まで】
summary: 「あなたの個人情報が漏えいしました」と連絡が来たときに、漏れた情報の種類ごとにやることを1枚にまとめました。日頃の対策として、パスワードマネージャーで使い回しをなくし、パスキーでパスワードそのものを使わない形に移る方法も整理します。IPAが2026年10月26日に公開した注意喚起と、日本ハッカー協会・杉浦隆幸氏の講演（Security Days Fall 2026）で語られたインフォスティーラーと自動アップデートの話がベースです。
status: draft
visibility: public
canvas: standard
createdAt: "2026-10-29"
updatedAt: "2026-10-29"
tags:
  - security
  - passkey
  - phishing-resistant
  - mfa
  - vulnerability
slides:
  - id: opening
    title: 漏れたら「何が漏れたか」で動く
    durationInFrames: 240
    notes: 冒頭で言い切る。漏えいの連絡が来たら、慌てずに「何が漏れたか」を確認して、種類ごとに決まった手を打つ。そして本当の対策は、漏れても困らない状態にしておくこと。パスワードを使い回さない、できればパスワード自体を使わない。
  - id: why-now
    title: 大情報漏洩時代
    durationInFrames: 260
    notes: なぜ今この話か。漏えいの公表が相次いでいる。日本ハッカー協会の杉浦隆幸氏は、AIが脆弱性探しでトップレベルの攻撃者並みになり、量は普通の攻撃者の100倍近いと話している。人間なら2週間かかる脆弱性探しが数時間。脆弱性の公開から約1日で攻撃が始まる。つまり、自分がどれだけ気をつけても、使っているサービス側から漏れることは避けられない。漏れる前提で備える。
  - id: first-step
    title: まず確認。メールのリンクからは行かない
    durationInFrames: 240
    notes: 確認の方法は3つ。事業者からの連絡、公式サイトのお知らせ、サポート窓口。ただし「漏えいしました」という通知そのものを装った偽メールもあり得る。リンクは踏まず、公式サイトを自分で検索するかブックマークから開く。
  - id: by-type
    title: 漏れた情報ごとにやること
    durationInFrames: 360
    notes: IPAの整理をそのまま1枚に。パスワードは変更、使い回し先も全部。カードはカード会社に連絡して停止・再発行の相談と明細チェック。メール・電話・住所・氏名は詐欺の材料になるので、届くメールやSMSは疑ってかかる。不審な着払いは受け取らない。免許証などの画像は、なりすまし契約を防ぐために信用情報機関（JICC・CIC・KSC）への本人申告を検討。
  - id: why-reuse
    title: 一番効く対策は「使い回しをやめる」
    durationInFrames: 260
    notes: 漏れたIDとパスワードのリストを、ほかのサービスに片っ端から試すのがリスト型攻撃。使い回していなければ、漏れたサービス1つで被害が止まる。でも人間の頭で全部違うパスワードを覚えるのは無理。だから道具を使う。
  - id: infostealer
    title: 自分のPCからまるごと抜かれることもある
    durationInFrames: 300
    notes: もう1つの漏れ方がインフォスティーラー。PCに入り込んだマルウェアが、ブラウザに保存したURL・ID・パスワード・カード情報・暗号資産の鍵をまとめて抜く。杉浦氏の講演では、1人で1000近いIDがまるごと漏れる例や、肌感覚で3000人に1人が被害に遭っているという話があった。対策は感染させないこと。更新を止めない、出所の分からないソフトや拡張機能を入れない。感染したら端末を初期化し、きれいな別の端末からパスワード変更とログアウトをする。
  - id: password-manager
    title: パスワードマネージャーに覚えさせる
    durationInFrames: 300
    notes: パスワードマネージャーは、サービスごとに長いランダムなパスワードを作って保存し、自動入力してくれる。自分で覚えるのはマネージャーを開く1つだけ（ここは長く、多要素認証も付ける）。おまけの効果として、偽サイトではドメインが違うので自動入力されない。これがフィッシングに気づくきっかけになる。ブラウザやOS標準（Google パスワードマネージャー、iCloud キーチェーン / パスワード アプリ、Microsoft Edge）でも十分。
  - id: passkey
    title: パスキーなら、そもそもパスワードが無い
    durationInFrames: 320
    notes: パスキーは指紋・顔・PINでスマホやPCのロックを解除するだけでログインできる仕組み。サービス側に置かれるのは公開鍵だけで、秘密鍵は自分の端末から出ない。だからサービスから漏れても、ログインに使える情報が無い。さらに登録したサイトでしか動かないので、偽サイトに入力させられることもない。パスワード＋SMSコードは偽サイトで両方盗まれ得るが、パスキーは盗むものがない。
  - id: auto-update
    title: 更新は自動にしておく
    durationInFrames: 260
    notes: 杉浦氏の講演の結論は自動アップデート。脆弱性の公開から約1日で攻撃が始まるので、人が判断していては間に合わない。PC、スマホ、ブラウザ、家のルーター、NASまで自動更新を有効に。サポートが切れた機器はすぐ使うのをやめる。
  - id: priority
    title: 強い順に並べると
    durationInFrames: 280
    notes: 強い順。パスキー（パスワードを消せるならそれが最強）、次にパスワードマネージャーのランダムパスワード＋多要素認証、最後が使い回し。今日いきなり全部パスキーにする必要はない。大事なアカウントから順に上へ上げていく。パスキーを入れても、パスワードでのログインが残っていればそちらは狙われ得るので、消せるサービスでは消す。
  - id: checklist
    title: 今日やる4つ
    durationInFrames: 320
    notes: 1つめ、メール・Apple/Google/Microsoftアカウント・銀行・カード・通販など、乗っ取られると困るものからパスキーを登録。メールは他のアカウントのパスワードリセット先なので最優先。2つめ、パスワードマネージャーに全部入れて、使い回しを見つけて潰す（多くのマネージャーに使い回し・漏えい検出機能がある）。3つめ、登録情報は最小限にして、使わないアカウントは削除。ただし削除しても事業者側に残る場合があるので規約を確認。4つめ、PC・スマホ・ルーターの自動更新がオンになっているか確認し、サポート切れの機器は外す。
  - id: sources
    title: 出典と相談先
    durationInFrames: 200
    notes: IPAの注意喚起、CNET Japanの記事、INTERNET Watchの講演レポート。困ったらIPAの情報セキュリティ安心相談窓口へ電話かメールで相談できる。
