slug: personal-data-leak-response
title: 自分の情報が漏れたら、まず何をする？【パスワードを使わない対策まで】
summary: 「あなたの個人情報が漏えいしました」と連絡が来たときに、漏れた情報の種類ごとにやることを1枚にまとめました。日頃の対策として、パスワードマネージャーで使い回しをなくし、パスキーでパスワードそのものを使わない形に移る方法も整理します。IPAが2026年10月26日に公開した注意喚起がベースです。どれも10年以上前から言われている当たり前の対策で、いつからの常識なのかも年表で添えています。
