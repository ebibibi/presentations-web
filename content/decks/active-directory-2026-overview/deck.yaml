slug: active-directory-2026-overview
title: Active Directory入門 2026 — まず把握すべき要素・概念・単語
summary: 既存のPart 1で扱った章立てと話順を基本的に踏襲し、フォレストから診断コマンドまでを浅く広く理解する2026年版。
status: draft
visibility: public
createdAt: "2026-08-19"
updatedAt: "2026-08-19"
order: 106
tags:
  - active-directory
  - windows-server
  - identity
  - microsoft
youtube:
  id: lZ8Ps6U_kvY
  url: https://www.youtube.com/watch?v=lZ8Ps6U_kvY
  title: Active Directory入門 まずは把握すべき要素・概念・単語をざっと理解！
slides:
  - id: opening
    title: Active Directory入門 2026
    durationInFrames: 180
    notes: 元動画の内容と話順を基本的に踏襲し、視認性と2026年時点の補足だけを更新します。収録時はBGMを使用しません。
  - id: goal
    title: この動画の目的
    durationInFrames: 180
    notes: 元動画00:51。Part 1では操作へ入らず、まず理解しておくべき項目と用語をざっと把握します。
  - id: original-map
    title: 元動画の全体図
    durationInFrames: 260
    notes: 元動画01:14以降に登場する用語を、構造・サービス・データ・運用の順に一覧化します。これは新しい分類を教えるためではなく、章の見取り図です。
  - id: structure
    title: フォレスト、ドメイン、コンテナ、OU、サイト
    durationInFrames: 220
    notes: 元動画01:14。フォレスト、ドメイン、コンテナ、OUの論理構造と、サイト、サブネット、サイトリンクのネットワーク構造を紹介します。
  - id: ad-and-dns-history
    title: ADとDNSの関係
    durationInFrames: 220
    notes: 元動画02:52。ADのドメイン概念はNTドメインから続き、Active DirectoryでDNSの名前と仕組みを利用するようになりました。
  - id: forest-domain
    title: フォレストとドメインの関係
    durationInFrames: 230
    notes: 元動画04:49。フォレストが最上位で、その中に1個以上のドメインを作れます。
  - id: forest-patterns
    title: シングル／マルチフォレスト・ドメイン
    durationInFrames: 230
    notes: 元動画06:30。DNS階層が似ていても同じフォレストとは限らないため、フォレストの関係を確認します。
  - id: site
    title: サイト、ドメインコントローラー、サブネット
    durationInFrames: 230
    notes: 元動画08:29。IPサブネットをサイトへ対応付け、クライアントがネットワーク的に近いDCを優先利用できるようにします。
  - id: site-link
    title: サイトリンク
    durationInFrames: 210
    notes: 元動画11:30。サイト間の接続、コスト、複製間隔とスケジュールを定義します。
  - id: container-ou
    title: コンテナとOU
    durationInFrames: 220
    notes: 元動画12:33。ドメイン内のオブジェクトを管理しやすく分けます。OUは整理、管理委任、GPOリンクに使います。
  - id: ad-integrated-dns
    title: DNSとActive Directory統合ゾーン
    durationInFrames: 220
    notes: 元動画15:43。AD統合DNSゾーンはAD DS内へ保存され、AD DSの複製を使ってDC間へ複製できます。
  - id: srv-record
    title: SRVレコード
    durationInFrames: 210
    notes: 元動画18:44。クライアントはDNSのSRVレコードを使って、ドメインやサイトのサービスを提供するDCを探します。
  - id: directory-service
    title: ディレクトリサービス
    durationInFrames: 190
    notes: 元動画20:21。ユーザー、グループ、コンピューターなどを階層を持つディレクトリデータとして保存します。
  - id: ldap
    title: LDAP
    durationInFrames: 200
    notes: 元動画20:28。LDAPはディレクトリを検索・更新するためのプロトコルです。2026年の保護要件も短く補足します。
  - id: authentication
    title: NTLM、Kerberos、CredSSP
    durationInFrames: 220
    notes: 元動画21:20。KerberosとNTLMは認証方式、CredSSPは資格情報をリモート先へ委任する仕組みとして区別します。
  - id: group-policy
    title: グループポリシー
    durationInFrames: 220
    notes: 元動画22:44。Domain参加したユーザーやPCへ、セキュリティ設定やWindows構成などを中央から適用します。
  - id: domain-join
    title: ドメイン参加
    durationInFrames: 210
    notes: 元動画24:00。PCアカウントと安全な関係を作り、Domain認証とGPOによる管理を始めます。
  - id: user-profile
    title: ユーザープロファイル
    durationInFrames: 220
    notes: 元動画24:53。ローカルユーザーとDomainユーザーは別の主体なので、同じ表示名でもユーザープロファイルは別です。
  - id: database-partitions
    title: ADのデータベースとパーティション
    durationInFrames: 240
    notes: 元動画27:15。Configuration、Schema、Domain、Applicationの各パーティションは、用途と複製範囲が異なります。
  - id: global-catalog
    title: グローバルカタログ
    durationInFrames: 210
    notes: 元動画29:30付近。GCはフォレスト内の各オブジェクトについて一部の属性を保持し、横断検索を助けます。
  - id: replication
    title: 複製ロジック
    durationInFrames: 230
    notes: 元動画30:49。書き込み可能DCは基本的にマルチマスターで、変更を相互に複製します。
  - id: tombstone
    title: Tombstone
    durationInFrames: 230
    notes: 元動画32:03。削除状態を複製するための情報にも保持期間があり、長期間オフラインのDCは慎重に扱います。
  - id: schema
    title: スキーマ
    durationInFrames: 210
    notes: 元動画36:18。スキーマはオブジェクト種類と属性を定義するフォレスト共通の設計図です。
  - id: fsmo
    title: FSMO（操作マスター）
    durationInFrames: 230
    notes: 元動画37:23。基本はマルチマスターですが、競合を避ける5つの処理は特定のDCが単独で担当します。
  - id: sysvol
    title: SYSVOL、FRS、DFSR
    durationInFrames: 220
    notes: 元動画39:22。SYSVOLのファイルはディレクトリデータとは別系統で複製され、現行構成ではDFSRを使います。
  - id: trust
    title: 信頼関係
    durationInFrames: 220
    notes: 元動画41:16。信頼関係は別ドメインの認証結果を受け入れる経路を作ります。権限の自動付与ではありません。
  - id: recovery
    title: 災害対策
    durationInFrames: 230
    notes: 元動画43:48。単一DC故障時の再構築と、全DC／フォレスト喪失時のバックアップからの復旧を分けて考えます。
  - id: diagnostics
    title: 診断コマンド
    durationInFrames: 220
    notes: 元動画45:46。dcdiag、repadmin、netdiag、csvdeを紹介します。netdiagは現在legacyであることを補足します。
  - id: changes-2026
    title: 2026年版の補足
    durationInFrames: 220
    notes: 元動画の順序を終えた後に、Windows Server 2025機能レベル、DFSR、Kerberos RC4依存縮小、LDAP保護を現行差分として補足します。
  - id: recap
    title: まとめとPart 2以降
    durationInFrames: 210
    notes: 元動画の用語をもう一度一覧化します。実際の管理画面、操作、コマンド実行はPart 2以降で扱います。
