slug: ai-rd-acceleration-2026
title: AIがAI研究を2倍速にした｜METR報告と「1年以内に超知能」という外挿
summary: 2026年11月、METR が Anthropic における AI 研究開発の加速を調べた報告書を公開しました。Ajeya Cotra 氏はこれを読み、Anthropic の RSP が定める「AIによる劇的な加速」のしきい値はすでに越えられていると論じます。能力向上は前年の約2倍速。そのためには研究者1人ひとりが約10倍速く働いている計算になり、社員の自己申告（約12倍）とも合います。加速が複利で効けば、素朴な外挿では1年以内に極端な超知能に至る。一方で業界のセキュリティや監視の備えは足りず、肝心の証拠の多くは黒塗り。落合陽一さんが「さようならホモサピエンス」と紹介した記事の要点を日本語でまとめます。
