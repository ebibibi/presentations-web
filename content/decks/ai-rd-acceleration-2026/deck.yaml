slides:
  - id: opening
    title: AIが、AIを作る速さを2倍にした
    durationInFrames: 240
    notes: 冒頭で言い切る。METR の報告書によると、Anthropic の能力向上はこの1年で前年の約2倍速になり、いまの速さの大部分は AI による自動化のおかげ。著者の Ajeya Cotra 氏は、これで Anthropic 自身の「劇的な加速」のしきい値はもう越えたと読む。加速が複利で効けば、素朴な外挿では1年以内に超知能。
  - id: source
    title: 元ネタ：落合陽一さんの「さようならホモサピエンス」
    durationInFrames: 180
    notes: 2026年11月7日、落合陽一さんが一言だけ添えて紹介した記事。書いたのは METR の Ajeya Cotra 氏。報告書そのものには関わっておらず、黒塗り前の版も見ていない、個人の意見だと断っている。
  - id: threshold
    title: Anthropic が自分で決めた「劇的な加速」の線
    durationInFrames: 260
    notes: Anthropic の RSP（2026年7月版）の条件は2つ。①AIがAI研究にあまり貢献していなかった頃の最速ペースの2倍で能力が伸びている（または伸びると見込まれる）。②それが計算資源の増加ではなく、AIによる研究の自動化のせいだと考えるのが妥当。Anthropic は S-1 で「まもなく到達するかもしれない」と書いた。
  - id: findings
    title: METR が見つけたこと
    durationInFrames: 260
    notes: 2025年10月から2026年10月の能力向上は、その前の12か月の約2倍速（社内版の能力指数 AECI で測定）。当初の加速には複数の理由があったが、いまも速いままなのは大部分がAIの自動化のおかげ。ただし、著者らが最も参考にした証拠の大半と、AIのせいだと判断した理由は黒塗り。
  - id: section-why-10x
    title: 全体が2倍なら、研究者は10倍
    durationInFrames: 150
    notes: ここから記事の核心。全体の進歩が2倍になるには、人間の研究者はもっと大きく速くなっていなければならない。
  - id: math
    title: 2倍 → 約2〜3倍 → 約4〜9倍 → 約10倍
    durationInFrames: 320
    notes: 能力は「計算乗数（アルゴリズムの工夫）×学習用計算量」。計算乗数だけで全体を2倍にするには、計算乗数は約2〜3倍速く伸びる必要がある。計算乗数を見つけるには研究者の労働と実験用計算の両方が要るので、労働は(2〜3)²＝約4〜9倍速くなる必要がある。さらに、簡単なアイデアから先に刈り取られて「アイデアは見つけにくくなる」ので、加速が数か月続いたいまは約10倍が要る。
  - id: time-warp
    title: 10人のチームではなく、10倍速の時間の泡
    durationInFrames: 280
    notes: 社員の非公式な自己申告は約12倍で、計算とよく合う。ただし10倍は「1人が10人のチームになる」ではない。10人のチームは10倍の仕事をしない。そうではなく、研究者全員が、外の1日の間に10日を過ごす時間の泡の中にいるイメージ。何人雇ってもこの速さは出せない。
  - id: compounding
    title: 倍加の間隔が半分ずつ縮む
    durationInFrames: 300
    notes: AIが強くなるほど研究者はさらに速くなる。1年かかった仕事が1か月、1週間、1日へ。約1年で「少しの加速」から「2倍速」まで来た。なめらかに続くなら、次の2倍は6か月、その次は3か月、その次は6週間。足し合わせると1年以内に能力が発散する。現実にはソフトウェア効率の上限があるが、その上限はずっと先だと著者は見ている。METR はこの複利を止めるボトルネックや急な収穫逓減の証拠を見つけなかった。
  - id: risk
    title: その先に出てくるAI
    durationInFrames: 240
    notes: 著者の見立て。このループをくぐり抜けたAIは、新しい兵器をすぐに作れ、紛争になれば人類文明を簡単に圧倒できる。深刻にミスアラインしていれば、人類の力を奪い、絶滅につながりうる。
  - id: not-ready
    title: 業界はまだ備えができていない
    durationInFrames: 300
    notes: 旧RSP（2025年5月）では、今回より弱い段階（AI R&D-5）でも「国家レベルの攻撃者からモデル重みを守る」セキュリティが最低条件だった。ところが OpenAI も Anthropic も最近、アマチュア集団にセキュリティを破られている。必要なのはセキュリティに加えて、全面的な監視、監視役同士の共謀対策、効いているか確かめられるアライメント手法、危なくなったら進歩を遅らせるガバナンス。
  - id: redacted
    title: 肝心の証拠は黒塗り
    durationInFrames: 220
    notes: 著者は同僚の仕事を信頼して見立てを大きく変えたが、証拠がもっと公開されていてほしかったと書く。外部の科学者がデータを検証できないと、タイムラインについて認識をそろえるのが難しい。そして、そろえる時間はもう少ないかもしれない。
  - id: summary
    title: まとめ
    durationInFrames: 240
    notes: ①AIによるAI研究の加速は、もう「将来の話」ではなく測定された話になった。②全体2倍の裏で、研究者は約10倍速。③複利で効けば1年以内という外挿が出る。④安全側の備えと証拠の公開が追いついていない。数字の多くは著者の単純化したモデルによる推定で、不確かさは大きい。
  - id: sources
    title: 出典
    durationInFrames: 150
    notes: 元記事、METR の報告書、落合陽一さんのポスト。
