slug: authenticator-authmask
title: Android版Authenticatorが偽Teamsにトークンを渡した｜AuthMask（CVE-2026-80097）
summary: Android版 Microsoft Authenticator の認証ブローカーが、権限ゼロのアプリに「私は Teams です」と名乗られただけで、職場アカウントのアクセストークン・リフレッシュトークンを渡していました（CVE-2026-80097、CVSS 8.6）。研究者 Enclave の公開記事「AuthMask」（2026年10月）と Microsoft のセキュリティ更新ガイドをもとに、仕組み（自分で自分を確かめる署名チェック）、取られる権限、MFA が効かない理由、2026年に続いた同系統の脆弱性、利用者と管理者が今日やることをまとめます。修正版は 6.2606.4246 以降です。
status: draft
visibility: public
canvas: standard
createdAt: "2026-10-28"
updatedAt: "2026-10-28"
