slides:
  - id: opening
    title: Authenticatorが偽Teamsにトークンを渡した
    durationInFrames: 240
    notes: 冒頭40秒で言い切る。Android版 Microsoft Authenticator が、権限ゼロの偽アプリに「私は Teams です」と名乗られただけで、職場アカウントのトークンを渡していた。CVE-2026-80097、CVSS 8.6。修正版は 6.2606.4246。Android で Authenticator を使っている人は、いますぐバージョンを確認する。
  - id: cta-intro
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート。
  - id: facts
    title: 事実だけ先に
    durationInFrames: 300
    notes: Microsoft のセキュリティ更新ガイドの値。公開は2026年9月8日（米国時間）、9月15日に修正ビルド番号を訂正。深刻度は Important、影響は特権の昇格、CWE-287（不適切な認証）。公開時点で「悪用なし・一般公開なし」、悪用可能性評価は Exploitation Less Likely。ただし10月下旬に研究者が技術詳細を公開したので、ここからは条件が変わる。iOS版はこの CVE の対象に入っていない。
  - id: confession
    title: 正直、私も勧めてきた側です
    durationInFrames: 240
    notes: 要本人確認：本人の体験として言えるか確認。言えない場合はこのスライドを差し替える。「MFA は Authenticator で」「パスワードレスは Authenticator で」と勧めてきた。Authenticator は MFA の通知アプリであると同時に、Android では他の Microsoft アプリにトークンを配る「ブローカー」でもある。今回壊れたのは後者。
  - id: timeline
    title: 2026年、Androidのトークン系の穴が続いている
    durationInFrames: 320
    notes: 3月 CVE-2026-26123（サインインのディープリンクを悪意あるアプリが受け取る、CVSS 5.5、Android 6.2511.7533 / iOS 6.8.40 で修正）。5月 CVE-2026-41615（承認させたリクエストでトークンを攻撃者側へ送らせる、CVSS 9.6、Android 6.2605.2973 / iOS 6.8.47）。6月 Enclave が Office 系 Android アプリ（Word・Excel・PowerPoint 等）の本番ビルドにデバッグフラグが残り、他のアプリへトークンを渡していた件を公開。9月8日に今回の CVE-2026-80097。10月下旬に Enclave が技術詳細「AuthMask」を公開。
  - id: mechanism
    title: 何が起きたか
    durationInFrames: 320
    notes: Authenticator には AccountChooserActivity という受付画面があり、exported=true、つまり端末のどのアプリからでも起動できた。門番は「呼び出し元の画面があるか」だけ。呼び出し元の UID・パッケージ名・クライアントID・リダイレクトURI・スコープはすべて、呼び出し側が書いた intent の中身から読んでいた。結果として、トークンが入ったバンドルを、起動した偽アプリへそのまま返した。
  - id: self-check
    title: 自分で自分を確かめる署名チェック
    durationInFrames: 320
    notes: 検証はあった。申告されたパッケージ（例 Teams）の署名を端末から読み、そこから「そのアプリが使うはずのリダイレクトURI」を作り、送られてきたURIと比べる。だが本物の Teams が端末に入っていれば、その署名は誰でも PackageManager で読める。偽アプリも同じ計算をして同じURIを送れるので、検査は必ず通る。本当の呼び出し元のパッケージ名は getCallingActivity() で取れていたが、信頼判断には使っていなかった。コードは Enclave の記事からの抜粋。
  - id: scopes
    title: 名乗る相手を変えれば、取れる権限も変わる
    durationInFrames: 300
    notes: Enclave の検証では3種類の偽装で3種類のトークンを得た。Teams として Graph を要求すると、メールの読み書きと送信、ファイル、予定表、チャット送信、SharePoint。Teams のチャット基盤として user_impersonation。Authenticator 自身のクライアントとしては、認証方法の読み書きとパスキーの作成・削除。最後のが一番怖い。盗んだ側が自分のパスキーを足せば、トークンが切れたあとも入り直せる余地がある（ここは私の推測で、記事が実証したのはスコープの取得まで）。
  - id: mfa
    title: なぜMFAが効かないのか
    durationInFrames: 280
    notes: MFA はサインインの瞬間を守る仕組み。ブローカーが持っているのは MFA を通過したあとに発行されたトークン。それを渡してしまえば、攻撃者は MFA をもう一度通る必要がない。しかもリフレッシュトークンが含まれるので、アクセストークンの期限が切れても取り直せる。
  - id: disagreement
    title: Microsoft と研究者で「必要な操作」の説明が違う
    durationInFrames: 280
    notes: Microsoft の FAQ は「悪意あるアプリを入れて実行させ、Authenticator で認証フローを完了するようユーザーを説得する」必要があるとし、CVSS も UI:R（ユーザー操作が必要）。Enclave は「サインイン済みの職場アカウントがあるブローカーが入っているだけで、それ以上のユーザー操作は不要だった」と書いている。どちらにしても前提は「悪意あるアプリが端末に入っていること」。だから更新と、野良アプリを入れないことの両方が要る。
  - id: checklist
    title: 今日やること
    durationInFrames: 320
    notes: 利用者は3つ。Play ストアで Microsoft Authenticator を開いて更新、設定のアプリ情報でバージョンが 6.2606.4246 以上か見る、Play ストア以外からアプリを入れない・見覚えのないアプリを消す。管理者は3つ。Intune の管理対象 Google Play なら更新の優先度を「高優先度」にする、アプリのインベントリでバージョンを確認する（BYOD で非管理の端末は見えないので周知で補う）。疑わしい利用者がいれば、サインインログの非対話型サインイン（Teams などのクライアント名義で、見覚えのない IP から）を確認し、セッションを取り消し、登録済みの認証方法（特にパスキー）を見直す。管理者向けの項目は記事をもとにした私の提案。
  - id: closing
    title: MFAの「後ろ」も守る
    durationInFrames: 240
    notes: 締め。MFA を入れたら終わりではない。MFA を通ったあとのトークンを誰が持ち、誰に渡すかが次の攻撃面。出典は Enclave の記事と Microsoft のセキュリティ更新ガイド。
  - id: cta-outro
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート。
