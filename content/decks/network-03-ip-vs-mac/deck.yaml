slug: network-03-ip-vs-mac
title: ネットワーク超基礎 03 — MACアドレスって何？ IPとどう違う？
summary: 自著の「宛先MACが分からなければ？」という問いを起点に、フレーム、ARP、スイッチを順に動かす。
status: draft
visibility: public
thumbnail: /thumbs/network-03-ip-vs-mac.svg
createdAt: "2026-09-23"
updatedAt: "2026-09-24"
tags: [ network, tcp-ip, it-foundations, tutorial ]
slides:
  - id: opening
    title: WebサイトのIPが分かった後は？
    durationInFrames: 190
    notes: "胡田昌彦『Windowsインフラ管理者入門』（カットシステム、2014年）第3章をもとに、PC視点の問いを出す。"
  - id: two-labels
    title: IPパケットとLANフレーム
    durationInFrames: 220
    notes: "資料用IP203.0.113.10。家庭内で次に渡す相手はルーター。EthernetとWi-Fiのフレーム構造は異なるので模式図に限る。"
  - id: next-hop
    title: IPはWebサイト／MACはルーター
    durationInFrames: 220
    notes: "原稿第3章の『フレームの構造』を、家から外への送信に適用。IPv4の家庭用LANの典型例である。"
  - id: hop-rewrite
    title: 区間ごとにMACを付け替える
    durationInFrames: 240
    notes: "MACは区間ごとに作り直し、宛先IPは変わらない。TTLはルーターで1減る。送信元IPの変化は家庭用ルーターのNATによるもので、一般のルーターは送信元IPを変えない。PPPoE接続では外側ヘッダーの形が異なる。"
  - id: arp
    title: ARP要求をブロードキャスト
    durationInFrames: 230
    notes: "ARPの宛先を知らないから全員宛てを使う、という原稿の問いを動画で示す。キャッシュ済みなら毎回問い合わせない。"
  - id: changing-links
    title: ARPの返事が戻る
    durationInFrames: 220
    notes: "IPが一致した相手が自身のMACを通常ユニキャストで回答。原稿第3章のARP・ブロードキャストを再構成。IPv6はNDを使う。"
  - id: arp-packet
    title: ARP要求と応答の中身
    durationInFrames: 240
    notes: "EtherType 0x0806。ARPはIPヘッダーを持たない。要求は宛先MAC FF-FF-FF-FF-FF-FF のブロードキャスト、応答は通常ユニキャスト。値は RFC 7042 文書用MAC。"
  - id: compare
    title: スイッチは送信元MACを学習
    durationInFrames: 230
    notes: "ARP表（IPとMAC）とスイッチのMACアドレス表（MACとポート）の違い。未学習宛先の扱いは口頭で補足。"
  - id: recap
    title: arp -aで表を確かめる
    durationInFrames: 200
    notes: "自分のPCのIP→MAC対応を表示。利用中のネットワークを確認する。実際のアドレスを公開しない。"
  - id: sources
    title: 既存Wireshark講座につなぐ
    durationInFrames: 220
    notes: "既存の無料動画でARP・ICMPを観察。原稿は自著第3章、仕様はRFC 826。動画は新たに収録・公開したわけではなく既存講座へのリンク。"
