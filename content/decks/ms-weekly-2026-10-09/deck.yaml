    notes: 冒頭で言い切る。Windows Update の証明書が2027年に入れ替わり、月例更新が古いデバイスは接続できなくなる。
  - id: wu-cert
    title: Windows Update 証明書の期限
    durationInFrames: 300
    notes: 2027年5月17日（WS2019/2016・LTSC 2019）と6月19日（それ以外）。WSUS 配信は対象外。
