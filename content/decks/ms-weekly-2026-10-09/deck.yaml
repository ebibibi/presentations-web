    durationInFrames: 300
    notes: "#8 GPO 28個追加、#9 Intune・ConfigMgr 対応、#10 ゲーム・アプリのクラッシュ、#13 Ask Copilot 一時停止。"
  - id: windows-platform
    title: Windows のそのほか
