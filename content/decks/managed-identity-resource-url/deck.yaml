slug: managed-identity-resource-url
title: どのAPIをたたくのか？
summary: 「誰がAPIを使うのか？」を扱ったM365アプリ登録入門の続編。Resource URLがAPIごとに違う理由と、アプリ登録からアクセストークンを使ってAPIを呼ぶまでの流れを整理する。
status: public
visibility: public
