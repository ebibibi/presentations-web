slug: managed-identity-resource-url
title: resource と scope を混ぜない
summary: Entra IDのv1 endpointで使うresource、v2 endpointで使うscope、Managed IdentityのローカルトークンAPIに残るresourceを明確に分離する。前回のMicrosoft Graphメール取得例からAzure AI Searchへつなぎ、トークンの対象と実際のAPI endpointが違う理由を10枚で整理する。
status: draft
visibility: public
createdAt: "2026-08-11"
updatedAt: "2026-08-11"
order: 103
tags:
  - azure
  - managed-identity
  - entra-id
  - oauth
  - azure-ai-search
slides:
  - id: opening
    title: resource と scope を混ぜない
    durationInFrames: 180
    notes: 前回の「M365アプリ登録入門」の補完回です。前回は、なぜアプリにもIDが必要なのか、ユーザー委任なのかアプリ単独なのか、つまり「誰がAPIを呼ぶか」に集中しました。今回は「どのAPI向けのトークンを取るか」です。ただしresourceとscopeを同じ話として混ぜると分かりにくくなるため、まずEntra IDのv1とv2を明確に分けます。
  - id: viewer-question
    title: 今回いただいた質問
    durationInFrames: 210
    notes: 質問は、LearnにResource URLとしてmanagement.core.windows.netと書くのに、実際のAPI要求はmanagement.azure.comへ送るのはなぜか、というものでした。さらにAzure AI Searchではsearch.azure.comとサービス固有のsearch.windows.netが出てきます。URLなのだから、実際の投げ先をそのまま指定すればよいのではないか。加えて調べるとresourceとscopeの両方が出てきて、何が違うのか。ここを整理します。
  - id: acquisition-interfaces
    title: 最初に3つを分ける
    durationInFrames: 245
    notes: 最重要スライドです。Entra IDのv1 token endpointへ直接要求する旧方式はresourceを使います。v2 token endpointへ直接要求する現在の方式はscopeを使い、アプリ単独ではリソース識別子の後ろに/.defaultを付けます。そしてManaged IdentityのローカルトークンAPIにもresourceという引数が残っています。これはアプリがEntraのv1 endpointを直接選んだという意味ではなく、Managed Identityブローカー側のAPI契約です。Azure AI Searchが3種類の認証APIを提供しているわけでもありません。
  - id: recommended-path
    title: 新規開発では何を使うか
    durationInFrames: 210
    notes: 新しく作るならAzure SDKにDefaultAzureCredentialを渡すのが基本です。SDKがトークン取得の詳細を抽象化します。自分でv2 token endpointへHTTP要求を書く場合もscopeを使います。Azure AI Search向けならscopeはhttps://search.azure.com/.defaultです。自分でコードを書くか、ライブラリを使うかでresourceとscopeが決まるわけではありません。ADALとv1は既存コードの互換性として読み、新規で積極的に選ぶものではありません。
  - id: graph-bridge
    title: 前回のMicrosoft Graph例につなぐ
    durationInFrames: 230
    notes: 前回のメール取得では、サインインしたユーザーの代理でGraphを呼ぶため、ユーザー委任のMail.Readを扱いました。v2では具体的なscopeであるMail.Readを要求します。アプリ単独ならGraphの/.defaultを使います。実際の通信先はgraph.microsoft.com/v1.0/me/messagesです。ここでGraph URLの/v1.0はGraph REST APIのバージョンであり、Entra OAuth v1 endpointとは無関係です。前回の「誰が」に、今回の「どのAPI向け」と「どこへ送る」を足しただけです。
  - id: three-versions
    title: 3種類のバージョンを混ぜない
    durationInFrames: 220
    notes: v1やv2という言葉も3種類あります。1つ目はトークンを要求するEntra OAuth endpointのv1/v2。2つ目はアクセストークン内のver 1.0/2.0。これはAPI側が決めるため、v2 endpointへ要求してもver 1.0のトークンが発行されることがあります。3つ目はGraphの/v1.0やSearchのapi-versionといった呼び出し先REST APIのバージョンです。3つは別物です。
  - id: identifier-endpoint
    title: トークンの対象とHTTP送信先は別
    durationInFrames: 230
    notes: resourceやv2 scopeの前半は、トークンをどのAPI向けに発行するかを示す識別子です。endpointはBearer tokenを付けて実際にHTTP要求を送る入口です。URIは場所だけでなく固有名にも使えます。APIの身元を安定させながら、実際の入口をサービス単位、リージョン、バージョンなどで分けられます。マルチテナントだから分けたのが主因ではありません。単一テナントの独自APIでも識別子とendpointは分かれます。
  - id: service-map
    title: Graph・ARM・Searchを対応表で見る
    durationInFrames: 245
    notes: Microsoft Graphは識別子とendpointのホスト名が同じなので直感的です。一方、質問のカスタムコネクタ手順はARMを表すResource URLとしてmanagement.core.windows.netを要求し、実際のARM endpointはmanagement.azure.comです。Azure AI Searchをv2で明示要求するscopeはsearch.azure.com/.default、実際のデータプレーンendpointはサービス名.search.windows.netです。同じに見える場合も違う場合もあり、文字列ではなく役割で見ます。
  - id: managed-identity-flow
    title: Managed IdentityでSearchを呼ぶ
    durationInFrames: 230
    notes: 実装ではSearch SDKにDefaultAzureCredentialを渡します。SDKまたはManaged IdentityブローカーがSearch向けのアクセストークンを取得します。そのBearer tokenをサービス固有のSearch endpointへ送ります。さらにSearch Index Data Readerなど、操作に合ったRBACロールが必要です。トークンの対象が正しいことと、権限があることは別です。生のManaged Identity endpointを使う公式例でresource引数が現れても、それはブローカーAPIの入力形式だと読みます。
  - id: recap
    title: 実務での読み分け
    durationInFrames: 190
    notes: まとめです。oauth2/tokenとresourceならEntra v1の旧方式。oauth2/v2.0/tokenとscopeなら現在の方式で、アプリ単独は/.defaultです。Managed IdentityのローカルAPIにあるresourceは、そのブローカーのAPI契約です。発行されたトークンのverや呼び出し先APIのバージョンとは別物です。そしてresourceやscopeが示すトークンの対象と、実際のHTTP endpointも別です。新規開発はAzure SDKとDefaultAzureCredentialを第一選択にします。
