slug: copilot-managed-runtime
title: Copilot Managed Runtime登場｜AIで作った社内アプリをMicrosoftが統制つきで預かる時代へ
summary: 「Power Automateは役割を終えつつある」回の最後に「誰か作ってみませんか」と話した、市民開発者がAIで安全にアプリを作れる基盤。調べたら、Microsoftが2026年9月から Copilot Managed Runtime としてプレビュー提供していました。中身は普通のWebアプリ、データと統制はPower Platform。外への通信はブラウザで塞ぎ、出口はコネクタだけ。Azureをそのまま渡すよりはるかに統制された置き場所です。公式ドキュメントで分かった仕組み・既定の統制・料金・弱いところをまとめます。
