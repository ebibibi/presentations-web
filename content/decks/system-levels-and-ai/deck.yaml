slides:
  - id: opening
    title: AIの前に、見るべきものがある
    durationInFrames: 200
    notes: |
      経営者のみなさんに、今日はひとつだけ持ち帰っていただきたい話をします。
      「AIで効率化しよう」——その前に、必ず見るべきものがあります。
      それは、自社の業務が「今どのレベルで回っているか」です。
      同じAIを入れても、レベルが違えば結果は正反対になります。ここを見ないまま投資すると、お金も時間も溶けます。
  - id: ideal
    title: 理想は、人が何もしないこと
    durationInFrames: 190
    notes: |
      まず理想形から確認します。理想は「人ががんばって効率化された状態」ではありません。
      そもそも人が介在しなくても、システムが勝手に業務を回している状態です。
      効率化の最終形は、速く作業することではなく、作業そのものが存在しないことです。
  - id: amazon
    title: Amazonで起きていること
    durationInFrames: 240
    notes: |
      具体例としてAmazonを見てください。
      お客様がサイトで注文とカード登録をする。ここで注文が確定します。人の承認は挟まりません。
      裏では在庫がシステムで管理され、「誰々さんの注文だから、この棚のものをここへ動かせ」という指示が、ロボットや現場の人に自動で出ます。
      指示どおり動かせば、配送業者向けの伝票も自動で発行・貼付されて出荷に乗る。
      人がやるパート、ロボットがやるパート、他社に任せるパートが最小限に切り分けられていて、全部の記録がデータとして残ります。
  - id: data-stays
    title: データが残るから、次の手が打てる
    durationInFrames: 180
    notes: |
      そして何が起きたかが全部データで残る。だから分析ができるし、「これを買った人にはこれを薦める」といった施策も打てる。
      極端に言えば、人がいなくても大部分が回る。ここが決定的な差です。
  - id: good-system
    title: いいシステムとは
    durationInFrames: 190
    notes: |
      つまり優れたシステムとは、「そもそも人間が介在しなくていいもの」です。
      ここまで来ると人間の仕事が変わります。仕組みがちゃんと動いているかを監視すること、新機能を足すこと、ビジネスをどう伸ばすか考えること。より生産的な側へ人を寄せられる。
  - id: ai-easy
    title: この土台の上なら、AIは簡単
    durationInFrames: 190
    notes: |
      この土台があれば、AIを足してさらに効率化するのは非常に容易です。
      データはもう溜まっている。システムもある。だから基本は「システム改修」の範囲で終わる。特別なプロジェクトではありません。
      これが前提としての理想的な状況です。ただ、そこまで到達していないケースは、往々にしてあります。
  - id: worst
    title: 対極にある現場
    durationInFrames: 210
    notes: |
      では一番システム化されていない、良くない例を見てみましょう。
      「この商品いくらですか」という問い合わせがメールで届く。担当者が自分のメールボックスで一人で見て、手書きで「いくらです」と返す。「お見積もりを送りましょうか」と提案する。「この注文フォーマットに記入して送ってください」と案内する。
      ExcelとPDFがメールに添付されて飛び交うだけ。データを一元管理する場所がどこにもない。担当者が動かないと、全部が止まる。
      ファイルの置き場所がSharePointのこのフォルダ、とルール化されているならまだマシなほうです。
  - id: transcribe
    title: そして、人間が転記する
    durationInFrames: 200
    notes: |
      さらに悪いのはこの先です。受注のあと、メーカーへ仕入れる工程が走る。
      メーカーごとにフォーマットが違うから、受け取ったメールの中身を人が手で転記して、コピペして回る。
      これは本当に最悪です。人がやるから間違えるし、時間もかかる。そんな作業に人の時間が消えていきます。
  - id: bad-automation
    title: そこに、かぶせてはいけない
    durationInFrames: 210
    notes: |
      ここで多くの会社がやってしまうことがあります。
      Excelマクロでがんばる。このレベルの作業をAIでなんとかしようとする。RPAを入れて自動化する。
      これは非常にセンスの悪い自動化です。おかしな仕事の流れを、そのまま固定してしまうからです。
      本来やるべきなのは、システム化すること。そして仕事の流れそのものを統一することです。
  - id: gradation
    title: 現実は、この間のどこか
    durationInFrames: 220
    notes: |
      実際の会社は、この両極端の間の無限のグラデーションのどこかにいます。
      業務ごとにレベルが違うのが普通です。受注はレベル1、請求はレベル3、という状態がざらにあります。
      だから最初にやるべきは、自社の業務を並べて「これはどのレベルか」を判定することです。全社で一律に語らないこと。
  - id: approach
    title: 打ち手は3つ
    durationInFrames: 210
    notes: |
      システムの入れ方にもいくつかのパターンがあります。
      自社独自のビジネスだから、競争力を高めるために自社で開発する。SaaSなどの既存ツールを使う。SaaSを入れた上で、そのプラットフォーム上に自社の業務フローを構築する。
      プラットフォームをうまく使って業務を標準化できているのは非常に優れたやり方です。競争力の源泉となるコア領域に自社開発を集中させるのも、極めて合理的です。
      一般的な業務は、合理的なSaaSを選び、そのSaaSが最初から規定している形をそのまま素直に使うべきです。カスタマイズはしなければしないほど、柔軟性が残ります。
  - id: half-baked
    title: 中途半端なシステムの症状
    durationInFrames: 220
    notes: |
      問題は、そこまで整理できていないケースです。中途半端に作った結果、こうなります。6つ挙げるので、心当たりがあるか数えながら聞いてください。
      まず、開発がとにかく遅い。ちょっと直したいだけなのに何か月もかかる。
      障害が多く、止まるたびに人が張り付く。本来やらなくていい仕事が増え続けます。
      変えたいのに変えられない。一度作ってしまったせいで、業務側がシステムに合わせるしかなくなっている。
      APIが提供されておらず、他システムとの連携も自動化も一切できない。
      レガシーなブラウザでしか動かない、といった技術的負債を抱えている。
      そして、作った人がもういない。中身が分かる人間が社内にも社外にも残っていない。
      3つ以上当てはまったら、それはもう改修の対象ではなく、落とす対象です。
      最低でもAPIさえあれば、AIを使って自動化する余地が残ります。逆にAPIがないと、打つ手がなくなります。
  - id: worse-than-nothing
    title: 無いほうが、まだマシ
    durationInFrames: 220
    notes: |
      ここが今日いちばん伝えたいところです。
      今のAIは、システムがなくても「何でもできますよ」と言えるくらい賢くなってきました。
      だから、中途半端なシステムがあるくらいなら、何もなかったほうがむしろ良かった、という話になりかねない。
      APIもなく、AIも手が出せない。自動化しようとしたらブラウザのスクレイピングかRPAしかない。しかも硬直化していて時代の変化に合わせられない。
      それなら、システム自体が無いほうがまだマシです。
  - id: liability
    title: レガシーは、負の資産
    durationInFrames: 200
    notes: |
      こうしたレガシーシステムが社内にある組織は本当に要注意です。資産ではなく、マイナスの資産、負の資産です。
      なるべく早い段階で、これらを無くしていく必要があります。
      この負の資産を何とかすることは、もう経営者の至上命題だと思っています。現場では決められません。
  - id: two-steps
    title: 進め方は、この2つから
    durationInFrames: 220
    notes: |
      ではどう進めるか。まずこの2ステップを、きちんとやることです。
      1つめ、現状の業務の洗い出しとレベルの把握。今どんな業務があって、それぞれがどのレベルにあるのか。
      2つめ、合理化に向けたアプローチの判別。どういう順番で合理化するのが最適か。そして今の組織体制やメンバー、既存のやり方を踏まえて「まずはここまで持っていく」という現実的なゴールを置くこと。
      これをきちんと描ける専門家に設計してもらって、着実に進めるべきです。
  - id: closing
    title: 何年もかかる。だから今日から
    durationInFrames: 200
    notes: |
      これはおそらく何年もかかるロードマップになります。派手ではないし、来期の数字にもすぐには出ません。
      それでも、この地道な取り組みこそが必要です。
      使っているツールやシステムがすべてAPIで叩ける理想的な状態になっていれば、そこにAIエージェントを入れて仕事を任せるのは、めちゃめちゃ容易な話になります。
      AIを入れるかどうかの前に、決めるべきことがある。今日はそれだけ持ち帰ってください。
  - id: cta
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート（src/deck-shared.tsx の CtaSlide）。高評価・チャンネル登録・メンバーシップのお願い。
