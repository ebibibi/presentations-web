slug: system-levels-and-ai
title: AIの前に、見るべきものがある ─ 経営者のための業務レベル論
summary: 業務がどのレベルで回っているかを見極めないまま、AIやRPAをかぶせても事態は悪化する。理想は人が介在しない業務、最悪は中途半端なシステム。Amazonの姿を基準に、自社の業務レベルを測り、レガシーという負の資産を落とすまでのロードマップを経営者向けに解説する。
status: draft
visibility: public
