slug: claude-anywhere
title: 第18回 どこからでもClaude Code
summary: Claude Codeを机の前だけで使う時代は終わった。公式のRemote Control、Dispatch、Channels、Web、Projects、Routines、Slackを「自分のPCで動く／クラウドで動く」で整理し、DiscordからClaude/Codexの複数セッションを運用するOSS「CCDB」との違いも正直に比較する。Claude Codeの使い方コース 第18回。
status: public
visibility: members
createdAt: "2026-06-26"
updatedAt: "2026-10-06"
tags:
  - claude-code
  - course
slides:
  - id: opening
    title: どこからでもClaude Code
    durationInFrames: 175
    notes: 第18回スタート。Claude Codeはターミナルの中だけのツールじゃない。今日のゴールは2つ。①ターミナル以外からClaude Codeを動かす ②ここまでの18回を貫いてきたテーマを確認する。難易度は🟢、肩の力を抜いて聞ける回。
  - id: cta-intro
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート（src/deck-shared.tsx の CtaSlide）。高評価・チャンネル登録・メンバーシップ・noteメンバーシップのお願い。内容はテンプレート側で一括管理。
  - id: native-options
    title: 公式の入口は7つに増えた
    durationInFrames: 185
    notes: 2026年10月時点の公式機能を「どこで動くか」で2つに分ける。自分のPCで動く＝①Remote Control（手元のCLI/Desktop/VS CodeのセッションをWeb・スマホから操作）②Dispatch（スマホのClaudeアプリから頼むとDesktopがCodeセッションを起動。Pro/Maxのみ）③Channels（Discord・Telegram・iMessageから実行中セッションへイベントをpush）。クラウドで動く＝④Web/モバイルのクラウドセッション ⑤Projects ⑥Routines ⑦Slackの@Claude。PCの電源を切りたいならクラウド側、ローカルのファイルやMCPが要るならPC側。preview段階の機能を含むので、撮影時は公式ドキュメントを開いて「現在の仕様」と断る。出典 https://code.claude.com/docs/en/platforms
  - id: remote-control
    title: Remote ControlとWebの違い
    durationInFrames: 185
    notes: 同じclaude.ai/codeやモバイルアプリを入口に使っても、実行場所が違う。Remote Controlは自分のPC上で動き、ローカルファイル・MCP・ツール・設定をそのまま使える代わりにローカルプロセスを動かしておく。WebはAnthropic管理の隔離VMで動き、ローカルPC不要・並列タスク向き。Remote Controlは `claude remote-control` / `claude --remote-control` / セッション内 `/remote-control`。スマホから写真やファイルを添付でき、長い作業が終わるとプッシュ通知も来る。逆方向の移動もでき、`claude --cloud` で手元からクラウドへ仕事を送り出し、`claude --teleport` でクラウドのセッションを手元に引き戻せる。出典 https://code.claude.com/docs/en/remote-control と https://code.claude.com/docs/en/web-quickstart
  - id: whats-new
    title: 7月から増えたもの
    durationInFrames: 185
    notes: 前回デッキを作った7月から増えた公式機能を4つ紹介する。①Projects（public beta、Pro/Max）＝1つの会話にタスクを投げると、Claudeがクラウドの並列スレッドに分けて実行し、Overviewで「終わった／PR準備OK／返事待ち」をまとめる ②Routines（research preview）＝プロンプト・リポジトリ・コネクタを保存し、スケジュール・API・GitHubイベントで自動実行。CLIからは `/schedule` ③Slack＝チャンネルで @Claude とメンションするとクラウドで作業してPRを返す。チームで共有するIDで動かす版がClaude Tag（Team/Enterprise）④Remote Control中のプッシュ通知。共通点は「投げて放っておける」こと。出典 https://code.claude.com/docs/en/claude-projects https://code.claude.com/docs/en/routines https://code.claude.com/docs/en/slack
  - id: official-channels
    title: 公式ChannelsにもDiscordがある
    durationInFrames: 185
    notes: CCDBを出す前に、公式ChannelsがDiscord・Telegram・iMessageをサポートしている事実を正直に紹介する。Channelsはresearch previewで、MCPサーバーから「いま開いているセッション」にイベントをpushする仕組み。Discord公式プラグインを入れ、`claude --channels plugin:discord@claude-plugins-official` で起動する。メッセージを受ける間はセッションを開いておく必要がある。出典 https://code.claude.com/docs/en/channels
  - id: ccdb
    title: CCDBはDiscordを作業台にする
    durationInFrames: 185
    notes: 公式Channelsを否定せず用途の違いを説明する。CCDB（Claude & Codex Discord Bridge）はDiscordスレッド1つをAIセッション1つとして管理し、ClaudeとCodexのバックエンド切替、複数セッションの並行運用、ファイル添付、APIからのセッション起動、セッション間の観測・claim・引き継ぎまで含むOSS。単一の実行中セッションへイベントをpushするChannelsより、Discordそのものを複数AIの作業台・履歴・監査画面にしたい場合に向く。複数セッションをまとめる用途では公式にもProjectsが出たので正直に比較する。Projectsはクラウドで動き、PCを閉じても進む。CCDBはすべて自分のPCで動くので、ローカルのファイル・MCP・認証情報をそのまま使え、Codexも混ぜられる。
  - id: discord-demo
    title: CCDBの実演
    durationInFrames: 180
    notes: 実際の流れをステップで見せる。①Discordにスレッドを作る ②メッセージで指示を投稿 ③Claude CodeまたはCodexが反応して作業する ④結果とファイルがDiscordに返る。別スレッドでは別セッションが並行して動けるところまで見せる。
  - id: from-phone
    title: 実はスマホから使ってる
    durationInFrames: 170
    notes: 私の実例。スマホのDiscordから「これやっといて」と送り、結果を同じスレッドで確認する。ここでは「公式でもできるが、私はCCDBでDiscordを作業台にしている」と位置づけ、公式機能と自作OSSを混同しない。
  - id: anytime
    title: いつでも・どこでも
    durationInFrames: 170
    notes: 場所と時間の制約から解放される。移動中・スキマ時間・ソファの上からでも指示を投げられる。まとまった作業時間を確保しなくても、思いついた瞬間に動かせる。これが「どこからでも」の本当の価値。
  - id: backbone
    title: シリーズの背骨
    durationInFrames: 175
    notes: ここでいったん振り返り。ここまでの18回を通して、ずっと根っこにあったテーマは「コンテキスト管理」だった。どの回も、AIに正しい文脈を渡す工夫の話に行き着いていた。今日の「どこからでも」も、結局は文脈を運ぶ話の延長線上にある。
  - id: journey
    title: 学びの旅
    durationInFrames: 180
    notes: 旅路を1枚で振り返る。CLAUDE.md → カスタムコマンド → Hooks → サブエージェント → MCP → 第2の脳。すべてが「どうコンテキストを設計し、渡し、育てるか」でつながっていた。バラバラな機能ではなく一本の道だった。
  - id: context-core
    title: コンテキスト管理が全ての基本
    durationInFrames: 170
    notes: 締めのメッセージ。ツールやコマンドは入口で、本質はいつもコンテキスト管理。良い文脈を渡せばClaude Codeは強力な相棒になる。この一点さえ押さえれば、新しい機能が出ても応用が効く。
  - id: your-way
    title: あなたの使い方次第
    durationInFrames: 170
    notes: Claude Codeはどこからでも動く。あとは、それをどう使うかはあなた次第。テンプレ通りでなく、自分の生活と仕事に合わせて道具を組み立てていってほしい。学ぶだけで終わらせず、実践はここから始まる。
  - id: demo
    title: ここで手を動かす
    durationInFrames: 180
    notes: ここで実演。説明だけで終わらせず画面に映して実際にやってみせる。まずスマホ(Discord)からスレッドにメッセージを送って指示する。するとClaudeが反応して作業を進める様子を見せる。最後にスマホに結果が返り、完了を確認する。
  - id: recap
    title: 今日のまとめ
    durationInFrames: 160
    notes: 今日のまとめ。公式の入口は「自分のPCで動く」（Remote Control・Dispatch・Channels）と「クラウドで動く」（Web/モバイル・Projects・Routines・Slack）に分かれる。新しく増えたProjects・Routines・Slackで、投げて放っておく使い方が公式でもできるようになった。CCDBはDiscordを複数AIセッションの作業台にする別解。そしてここまでの18回を貫いてきたのはコンテキスト管理。
  - id: finale
    title: ここまでありがとう・続きます
    durationInFrames: 175
    notes: 締め。ここまで18回、ご視聴ありがとうございました。コースはまだ続くので、次回もぜひ。これからもClaude Codeを一緒に楽しんでいきましょう。チャンネル登録とメンバーシップ登録もよろしくお願いします！
  - id: cta-outro
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート（src/deck-shared.tsx の CtaSlide）。最後にもう一度、高評価・チャンネル登録・メンバーシップ・noteメンバーシップのお願い。
