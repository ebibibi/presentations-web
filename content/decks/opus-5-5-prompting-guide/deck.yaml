slug: opus-5-5-prompting-guide
title: Opus 5.5 公式プロンプトガイドの要点 ─「よく考えて」は消していい
summary: Anthropicが公開した「Prompting Claude Opus 5.5」の要点を整理します。思考量はプロンプトではなくeffortで調整し、既定のmediumでOpus 5のhigh相当。後半は、長時間タスクのチェックリスト、複数アプリの事前探索、マルチエージェントへの時間予算など、プロンプトの書き方よりハーネス側の設計が中心になっています。
