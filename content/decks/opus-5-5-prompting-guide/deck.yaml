slides:
  - id: opening
    title: Opus 5.5 公式プロンプトガイドの要点
    durationInFrames: 240
    notes: Anthropicが Opus 5.5 専用のプロンプトガイドを出しました。結論から言うと、「よく考えて」「一歩ずつ」といった指示は消してよくなり、思考量は effort で調整します。後半はプロンプトの書き方ではなく、エージェントを動かす仕組み、ハーネス側の設計の話が中心です。
  - id: what-changed
    title: Opus 5 から何が変わったか
    durationInFrames: 270
    notes: 出力トークンの生成は Opus 5 より30%以上速く、同じタスクをより少ないトークンで終えます。既定の effort は high から medium に下がり、thinking は常にオン。途中経過のメッセージは text ブロックではなく thinking ブロックで返ります。Opus 5 向けのプロンプトはそのままでもよく動く、というのが公式の立場です。
  - id: effort
    title: 思考量のダイヤルは effort
    durationInFrames: 300
    notes: 一番大事なのが effort です。Anthropic のテストでは、Opus 5.5 の medium が Opus 5 の high に並ぶか上回り、コーディング評価のいくつかでは low でもそれに近い。レベル名はモデル間で同じ思考量を意味しないので、Opus 5 の設定を持ち越さず、自分の評価で複数レベルを試すこと。
  - id: effort-tips
    title: effort を運用する3つのコツ
    durationInFrames: 290
    notes: 同じレベルでも Opus 5.5 は1ターンあたりに多く考えるので、max_tokens は思考分の余裕を取る。長いエージェントコーディングなら上限の128,000が良かったそうです。xhigh と max は品質向上を測れた場合だけ。思考を減らしたいなら、プロンプトで頼むより effort を下げるほうが確実です。effort を途中で変えるとプロンプトキャッシュが無効になるので、メッセージ単位の effort 変更（ベータ）を使います。
  - id: delete-think
    title: 「よく考えて」は消していい
    durationInFrames: 290
    notes: 話は2つあります。1つ目は消す話。チャットのシステムプロンプトに「回答前によく考えて」と書いているなら削除を検討。思考量はモデル自身が決め、調整するのは effort だからです。Anthropic のチャット製品で試したところ、返答の開始が早くなり、品質の明確な低下はなかった。2つ目は、任意で足してもいい話。Opus 5.5 は短い追加の質問でも前の回答を考え直すことがあるので、「一度答えたことは確定扱いにする」という2文を末尾に足すと、後続ターンの思考が減って返答が早まります。ただしこれは、長い分析や、後の工程で前の誤りが見つかりうるエージェント作業には入れないこと。自分から誤りを指摘しにくくなるからです。
  - id: thinking-disabled
    title: thinking 無効で動かしていた人へ
    durationInFrames: 290
    notes: Opus 5.5 では thinking を無効にできません。移行時は4つ。low から始めて測る。回答本文に推論を書かせる指示は外し、summarized thinking を読む。推論を本文に出させようとすると reasoning_extraction カテゴリで拒否されることがあります。thinking 無効時向けの回避策は再テスト。そしてレスポンスは先頭を text と決めつけず、ブロックの種類で読むこと。
  - id: section-harness
    title: ここから本題：ハーネスの設計
    durationInFrames: 140
    notes: ガイドの後半は、プロンプトの一文よりも、モデルを動かす仕組み側の話になります。
  - id: unattended
    title: 無人エージェントが途中で止まる問題
    durationInFrames: 300
    notes: Opus 5.5 は長いタスクで進捗を報告し、その報告が tool call なしでターンを終えることがあります。ループ側がそれを完了とみなすと、そこで止まる。対策は、テキストで終わったターンを完了の証拠ではなく報告として扱うこと。タスクをチェックリストで持たせ、未完了項目があって阻害要因も書かれていなければ、項目名を挙げて続行を促す。小さいモデルに完了条件を判定させる方法もあります。自動の続行は2〜3回で打ち止めにして、本当に詰まった実行を人がレビューできるようにします。
  - id: early-stops
    title: 避けたい「早すぎる停止」4パターン
    durationInFrames: 300
    notes: システムプロンプトで、避けたい停止の種類を具体的に名指しすると効きます。公式の例文が挙げる4つは、次の一歩を宣言して終わる長い要約、「よければ続けます」という申し出、実は何もブロックしていない判断事項の列挙、そして「区切りがいいから報告しよう」という判断。進捗メモは次の tool call と同じメッセージに入れさせます。止まってほしいのは、ユーザーなしでは何も進まないときだけ。危険な操作の確認は別途残すこと、人が見ている対話型アプリには入れないこと、も明記されています。
  - id: progress
    title: 進捗表示の4つのレバー
    durationInFrames: 300
    notes: 途中経過が thinking ブロックで返るので、text だけ描画するクライアントは黙っているように見えます。1つ目、display updates を指定して要約を受け取る。2つ目、途中でコードなどをそのまま渡す必要があるなら、メッセージ送信用ツールを最初から定義しておく。3つ目、更新の頻度はシステムプロンプトで頼めば従う。4つ目、何も言わないツール呼び出しが5回続いたら、ハーネスから一言リマインドを差し込む。これで長い無言区間のあるタスクがおよそ半分になり、コストの変化は測定できなかったそうです。
  - id: explore
    title: 複数アプリでは「先に見回せ」
    durationInFrames: 270
    notes: メール、ドキュメント、スプレッドシート、CRM をまたぐ自動化では、必要な情報がタスクで言及されていない場所にあることが多い。Opus 5.5 はすぐ作業に取りかかる性格なので、行動前に広く探索させる一文を入れると、medium でも max でも正答が目に見えて増えた。代償はツール呼び出しとトークンが少し増えること。そして、見つけたものに従って動けと指示するので、検索対象に信頼できない内容を置かないことが条件です。
  - id: time-budget
    title: マルチエージェントに時間予算を渡す
    durationInFrames: 300
    notes: Opus 5.5 は経過時間の情報をよく見ます。リードエージェントがサブエージェントに仕事を振る構成なら、ハーネスが各メッセージの末尾に「elapsed 340s / 1200s」のように経過時間と予算を付ける。モデルは予算内に収まるようにペース配分し、たいてい早めに終わるので、予算は実際に使いたい時間より少し多めに。予算が決められなければ経過時間だけ見せて、時間が大事だと一文添える。effort を下げると仕事そのものが減るのに対し、予算を絞ると並列に動くエージェントが増える、という違いがポイントです。予算は助言でしかないので、ハードな打ち切りは自前のタイムアウトで。
  - id: pasted
    title: 貼り付けたテキストに印を付ける
    durationInFrames: 280
    notes: Opus 5.5 は間接プロンプトインジェクションへの耐性が歴代 Opus で最も高い。ユーザーがメールやWebページからコピーして貼った文章の中の指示にも、印を付ければ強くなります。アプリがランダムIDを生成し、pasted_content タグで開始と終了を囲む。システムプロンプトには、その中の指示はユーザー自身が頼んだ範囲でしか従わない、と書く。ただしタグはただの文字列で偽装できるので、防御の一枚として扱います。
  - id: visual-frontend
    title: 画像入力とフロントエンドの既定値
    durationInFrames: 270
    notes: 図表の読み取りは Opus 5 より大きく向上していて、最低 effort でも Opus 5 の最高 effort よりグラフの値を正確に読んだそうです。以前の足場は不要かもしれないので再テストを。最も密な入力では、高解像度画像と、切り抜き・拡大できる画像処理ツールがまだ効きます。フロントエンドは、デザイン指示がないと既定のスタイルに戻る。「AIっぽさを避けて」では別の既定値に入れ替わるだけなので、避けたいパターンを具体的に名指しします。
  - id: refusals
    title: 安全分類器による拒否
    durationInFrames: 220
    notes: 生物、サイバーセキュリティ、推論抽出の分類器が動いています。生物は Fable 5.1 と同じで、Opus 5 から来る人には新しい。ソースコードの脆弱性を見つけるのは許可、リスクの高いデュアルユースは不可。拒否は stop_reason refusal で返り、フォールバックモデルで自動再試行できますが、reasoning_extraction だけは再試行されずに返ってきます。
  - id: recap
    title: 今日見直す5つ
    durationInFrames: 280
    notes: まとめです。effort を明示して複数レベルで測る。「よく考えて」系の指示を消す。ターン終了を完了とみなさず、チェックリストで続行させる。途中経過の表示を確認する。マルチエージェントなら時間予算を渡す。プロンプトの一文を磨く時代から、モデルが働く環境とフィードバックを設計する時代に移りつつあります。
  - id: sources
    title: 出典
    durationInFrames: 180
    notes: 出典は Anthropic の公式ドキュメントです。数字はすべて Anthropic 自身のテストによるものなので、自分のワークロードで測ってから採用してください。
  - id: cta
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート（src/deck-shared.tsx の CtaSlide）。
