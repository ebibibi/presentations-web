slides:
  - id: opening
    title: 1か月で972件
    durationInFrames: 200
    notes: 2026年9月のPatch Tuesdayは新規CVE 972件。まず件数の異常さを1文で言い切ります。数を読み上げるより「先月の1.5倍」「去年1年分の8割を1か月で」の実感を先に置きます。
  - id: numbers
    title: 今月の数字
    durationInFrames: 200
    notes: 972（新規）/ 997（Chromium等込み）/ 114 Critical / ゼロデイ2件。Ars TechnicaはCritical 112としており、数え方で数十件動くことに触れておきます。
  - id: chart-year
    title: 年別に見ると異常さが分かる
    durationInFrames: 260
    notes: MSRCのCVRF APIを自分で叩いて集計した年別件数。2021〜2025は年900〜1200件台で安定していたのが、2026年は9月までで2871件。ZDIやArsの集計と数十〜百件ずれるのは数え方の違いで、傾向は同じだと補足します。
  - id: chart-month
    title: 跳ねたのは今年の夏から
    durationInFrames: 260
    notes: 2026年の月別。6月まで月100〜200件台だったものが7月に急増し、9月に1000件近くへ。ZDIの集計では7月570件・8月620件・9月972件で、私の集計と月ごとの値は違いますが、跳ね上がりの時期は一致します。
  - id: why
    title: なぜ急に増えたのか
    durationInFrames: 240
    notes: AI支援の脆弱性発見。ベンダー側が見つけて直す速度が上がったという話で、製品が急に脆くなったわけではないと明確にします。
  - id: letter
    title: 業界は「先に見つけられる側」を競っている
    durationInFrames: 240
    notes: 8月下旬にOpenAI・Anthropic・AWS・Google・Microsoftら100超の企業・団体が共同書簡を出し、AI主導の攻撃がパッチ適用の猶予を縮めると警告した流れを説明します。
  - id: not-yet
    title: ただし「悪用の急増」はまだ来ていない
    durationInFrames: 230
    notes: ZDIのDustin Childsの言葉。件数は跳ねたが、それに比例した実際の悪用の急増はまだ観測されていない。だから今は仕組みを整える時間がある、という位置づけにします。
  - id: notable
    title: 今月これだけは見る
    durationInFrames: 260
    notes: ゼロデイ2件（Windows Update Stack / ALPC、いずれもEoP）と、Exchange・SharePoint・SQL Server・リモートデスクトップ・Authenticatorの重い項目。CVE番号は読み上げず、資産の名前で覚えてもらいます。
  - id: wormable
    title: 数えるのをやめた、という数え方
    durationInFrames: 220
    notes: ユーザー操作なしで感染が広がりうる脆弱性が20件を超えたところで数えるのをやめた、というChildsのコメント。件数の話から「性質」の話へ切り替える節目です。
  - id: triage
    title: 全部読むのは、もう無理
    durationInFrames: 280
    notes: 972件を読む運用は破綻する。悪用中→インターネット公開資産→ワーム性→自分が実際に持っている製品、の順で絞る。CVE単位の精読から、資産インベントリ起点の運用へ移す話にします。
  - id: counting
    title: 件数そのものを指標にしない
    durationInFrames: 240
    notes: 972なのか997なのか2760なのか2871なのかは数え方で変わる。件数を経営報告のKPIにすると、数え方が変わっただけで「急増」に見える。見るべきは適用までの日数と未適用資産の数だと結びます。
  - id: recap
    title: まとめ
    durationInFrames: 240
    notes: 3行に畳んで、一次情報リンクを出します。
