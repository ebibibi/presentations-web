slug: patch-tuesday-972
title: 1か月で972件 — Microsoftの月例更新が「新しい普通」に入った
summary: 2026年9月のMicrosoft月例更新は新規CVE 972件、Chromium等を含めて997件、Criticalは114件という過去最多になりました。AI支援の脆弱性発見が生んだこの件数増加を、MSRCの公開データを自分で集計したグラフで確認し、全部読めない量のパッチにどう優先順位を付けるかを整理します。
status: draft
visibility: public
createdAt: "2026-09-09"
updatedAt: "2026-09-09"
order: 108
canvas: standard
