slug: prompt-caching-explained
title: AIのプロンプトキャッシュ図解｜OpenAIが12時間キャッシュ開始、同じ資料100回で94%オフ
summary: 同じ資料を何度もAIに読ませるなら、2回目からは「先頭の読み込み」を使い回せます。それがプロンプトキャッシュです。答えを保存する仕組みではなく、入力を読んだ途中の計算（KVキャッシュ）を保存する仕組みで、先頭が1文字でも違えば外れます。OpenAI が2026年10月20日に出した12時間キャッシュ、OpenAI・Claude・Gemini の仕様の違い、10万トークンを100回読ませたときの料金（$20→約$1.24）、Claude Code チームが踏んだ「キャッシュを壊す5つの例」、今日確認する3項目を図でまとめます。
status: draft
visibility: public
canvas: standard
createdAt: "2026-10-21"
updatedAt: "2026-10-21"
tags:
