slug: phishing-resistant-mfa
title: そのMFA、中継されて終わりです ─ フィッシング耐性とは何か
summary: MFAには種類がある。コードを読んで入力する方式は、中間者攻撃で利用者に代行させられて突破される。番号一致も中継される。なぜFIDO2やWindows Helloだけが耐えるのか、その仕組みと、公式の認証強度3段階を整理する。
status: draft
visibility: public
createdAt: "2026-08-29"
updatedAt: "2026-08-29"
order: 109
tags:
  - entra-id
  - mfa
  - phishing-resistant
  - passkey
  - fido2
  - security
slides:
  - id: opening
    title: そのMFA、中継されて終わりです
    durationInFrames: 200
    notes: 多要素認証を入れました、で安心している組織は多いと思います。でも実際には、いま主流の攻撃はMFAを破っていません。利用者に代行させて、そのまま通り抜けています。今日はその仕組みと、なぜ一部の方式だけが耐えられるのかを説明します。
  - id: profile
    title: 解説する人：胡田 昌彦
    durationInFrames: 190
    notes: 解説する胡田昌彦です。Microsoft MVPを14年連続で受賞し、Windows、Azure、Microsoft 365を実機で検証してきました。今日は認証方式の「強さの差」だけに絞って話します。
  - id: section-kinds
    title: SECTION 1 ─ MFAには種類がある
    durationInFrames: 150
    notes: 最初のセクションです。多要素認証を一つのものとして扱うのをやめるところから始めます。
  - id: not-one-thing
    title: 「MFAを入れた」の中身は、同じではない
    durationInFrames: 220
    notes: 多要素認証を入れた、という言葉は、実際には全く強さの違うものを指しています。SMSで6桁を受け取るのも、パスキーで指紋を使うのも、どちらも多要素認証です。でも攻撃に対する強さは同じではありません。ここを一緒くたにしていると、対策したつもりで穴が残ります。
  - id: methods
    title: Entra IDが対応する認証方式
    durationInFrames: 250
    notes: まずMicrosoft Entra IDが対応している方式を並べます。単独で使えるもの、2要素目としてしか使えないもの、その区別があります。パスキー、Windows Hello、証明書は単独でも使えます。SMSや音声、OATHトークンは基本的に2要素目です。この一覧を見ると、選択肢がスマートフォンのアプリだけではないことが分かります。
  - id: strengths
    title: 公式には、強さが3段階ある
    durationInFrames: 260
    notes: ここが今日の土台です。Microsoftは条件付きアクセスの認証強度として、組み込みの3段階を用意しています。単なる多要素認証、パスワードレスの多要素認証、そしてフィッシング耐性のある多要素認証。フィッシング耐性に入るのは3つだけです。FIDO2セキュリティキー、Windows Helloまたはプラットフォーム資格情報、そして多要素の証明書ベース認証。パスワードと所持要素の組み合わせは、いちばん左の段にしか入りません。
  - id: section-what
    title: SECTION 2 ─ フィッシング耐性とは何か
    durationInFrames: 150
    notes: 二つ目のセクションです。よく聞く言葉ですが、定義を押さえると理解が一気に進みます。
  - id: definition
    title: 定義は、たった一行
    durationInFrames: 235
    notes: Microsoftの定義はこうです。フィッシング耐性のある強度には、認証方式とサインイン画面そのものが直接やりとりする方式が含まれる。これだけです。人が画面を見て、コードを読んで、別のところへ入力する。この人間を経由する部分が無い、という意味です。
  - id: handoff
    title: 「手で渡せる秘密」があるか、ないか
    durationInFrames: 240
    notes: 言い換えると、こう分けられます。利用者が手で渡せる秘密が存在する方式と、存在しない方式です。6桁のコード、承認のタップ、SMSの数字。これらは全部、利用者が誰かに渡せてしまいます。一方でパスキーの秘密鍵は、認証器から出てきません。利用者が渡そうと思っても渡せない。この差が、そのまま攻撃への強さの差になります。
  - id: section-why
    title: SECTION 3 ─ なぜ突破できるのか
    durationInFrames: 150
    notes: 三つ目のセクションです。実際の攻撃がどう動くのかを見ます。ここが今日の中心です。
  - id: premise
    title: MFAを破っているのではない
    durationInFrames: 225
    notes: 最初に前提を一つ。いま主流の攻撃は、多要素認証を数学的に破ってはいません。暗号を解いてもいないし、総当たりもしていません。やっているのは、利用者本人に多要素認証を代行させることです。だから利用者が正しく操作すればするほど、攻撃が成立します。
  - id: proxy
    title: 偽サイトの正体は「中継プロキシ」
    durationInFrames: 235
    notes: 昔のフィッシングサイトは、入力されたIDとパスワードを溜めるだけの箱でした。今は違います。利用者からの入力をその場で本物のサイトへ中継し、本物からの応答をそのまま利用者へ返す、リアルタイムのプロキシです。だから画面は本物と完全に同じものが出ます。見た目で見破るのはほぼ不可能です。
  - id: aitm-flow
    title: 中間者攻撃の5ステップ
    durationInFrames: 300
    notes: 順番に見ます。1、利用者が偽サイトでパスワードを入力する。2、攻撃者はそれを即座に本物へ中継する。3、本物が多要素認証を要求する。4、偽サイトが本物と同じ多要素の画面を表示し、利用者がコードを入力するか承認する。5、認証が成立し、攻撃者は発行されたセッションのクッキーを手に入れる。以後、攻撃者は再認証すら必要ありません。
  - id: number-matching
    title: 番号一致も、そのまま中継される
    durationInFrames: 250
    notes: よく聞かれるのが、番号一致にすれば防げるのでは、という質問です。防げません。Microsoftの脅威インテリジェンスがTycoon2FAというフィッシングキットを分析した記事に、はっきり書かれています。利用者が資格情報を送信すると、キットは即座に本物へ中継して本物の多要素チャレンジを発生させ、フィッシングページが同じ多要素の画面、たとえば番号一致やコード入力を表示する、と。番号一致が防ぐのは、身に覚えのない通知をうっかり承認してしまう、いわゆるMFA疲労攻撃です。中間者攻撃には効きません。
  - id: prize
    title: 盗まれるのはパスワードではない
    durationInFrames: 235
    notes: ここも誤解が多い点です。攻撃者の狙いはパスワードではありません。認証が完了した後に発行される、セッションのクッキーやトークンです。同じ記事に、利用者が多要素認証を完了すると攻撃者はセッションクッキーを取得し、それ以上の認証なしにリアルタイムでアクセスできた、と書かれています。つまりパスワードを変えても、そのセッションは生きたままです。
  - id: what-loses
    title: だから、この方式は全部負ける
    durationInFrames: 240
    notes: 中継できるものは全部負けます。SMS、音声通話、プッシュ通知の承認、ソフトウェアOATHトークン、そしてハードウェアOATHトークン。公式の認証強度の表では、これらはまとめて「パスワードと、利用者が持っている何か」という一つの枠に入っていて、フィッシング耐性の列には入りません。Tycoon2FAの記事も、SMSコード、ワンタイムパスコード、プッシュ通知を含む、一般に展開されているほぼすべての多要素認証方式を回避できた、と書いています。
  - id: section-fido
    title: SECTION 4 ─ なぜFIDO2は負けないのか
    durationInFrames: 150
    notes: 最後のセクションです。では、耐えられる方式は何が違うのか。
  - id: why-fido
    title: 2つの性質で成立している
    durationInFrames: 250
    notes: 理由は二つあります。一つ目、秘密鍵が認証器から出ません。だから利用者が渡そうと思っても渡せない。手で渡せる秘密が存在しないので、代行させることができません。二つ目、鍵が登録したドメインに束縛されています。本物のドメイン用に作られた鍵は、偽サイトのドメインからの要求にはそもそも応答しません。利用者が完全にだまされていても、鍵の側が反応しない。これが「認証方式とサインイン画面が直接やりとりする」の中身です。
  - id: the-three
    title: 公式のフィッシング耐性MFAは、この3つ
    durationInFrames: 235
    notes: 条件付きアクセスの組み込み認証強度で、フィッシング耐性に入るのは3つです。FIDO2セキュリティキー、これにはパスキーやAuthenticatorのパスキーも含まれます。Windows Hello for Businessまたはプラットフォーム資格情報。そして多要素の証明書ベース認証です。Authenticatorの電話サインインはパスワードレスですが、フィッシング耐性には入りません。
  - id: caveats
    title: 3つの落とし穴
    durationInFrames: 250
    notes: 実装するときの注意を三つ。一つ目、単一要素の証明書ベース認証は、どの強度にも入りません。多要素として構成する必要があります。二つ目、認証強度は最初の認証を制限しません。条件付きアクセスは初回認証の後に評価されるので、利用者はパスワードを入力できてしまい、そのあとで強い方式を求められます。三つ目、Windows Helloで最初にサインインしていない場合、強度を満たすために自動でWindows Helloを求められるとは限りません。サインインオプションから選び直す必要があります。
  - id: not-silver-bullet
    title: フィッシング耐性でも、止まらないもの
    durationInFrames: 240
    notes: 万能ではありません。公式にはっきり書かれています。利用者の資格情報が簡単にフィッシングできなくなると、攻撃者は端末からトークンを盗み出す方向へ移ることがある、と。だから次の一手として、トークンを発行先の端末のハードウェアに結び付けるトークン保護が案内されています。認証を強くしたら、次はトークンの持ち出しを見る、という順番です。
  - id: shared-devices
    title: 共有端末は、ここに注意
    durationInFrames: 250
    notes: 現場でよく詰まるところなので触れておきます。Windows Hello for Businessは、そのPCに各自が自分としてサインインする場合にだけ使うべきで、共有アカウントを使うキオスク端末に使ってはいけない、と公式に書かれています。また1台あたり10ユーザーまでという上限があり、それを超える共有端末ではセキュリティキーのようなポータブルな資格情報を使う、とされています。端末を共有する利用者は、Windows上のMicrosoft Entraパスキーかポータブルな資格情報だけを使うべき、とも書かれています。
  - id: how-to-start
    title: どこから始めるか
    durationInFrames: 245
    notes: 進め方は公式のガイドが具体的です。まず条件付きアクセスで、フィッシング耐性MFAの認証強度を要求するポリシーをレポート専用モードで作ります。これは登録キャンペーンを始める前に作れ、と書かれています。強制したら誰が止まるかの履歴を先に貯めるためです。次に利用者を管理者と高規制ユーザー、それ以外に分け、まず持ち運べる資格情報を1つ登録させ、その後に端末ごとのローカル資格情報を用意します。最後に、利用者と端末の組み合わせで準備ができたところから順に強制していきます。
  - id: recap
    title: 覚えるのは、この3つ
    durationInFrames: 220
    notes: まとめます。一つ目、MFAには強さの段階があり、公式には3段階に分かれています。二つ目、コードや承認を人が中継する方式は、中間者攻撃で代行させられて突破されます。番号一致も中継されます。三つ目、耐えられるのは、秘密鍵が外に出ずドメインに束縛された方式だけです。ここで本編はおしまいです。
  - id: related-videos
    title: 関連する解説動画
    durationInFrames: 210
    notes: 今日の話に関連する動画です。認証パターンの全体像、条件付きアクセスの除外の挙動、アプリ登録の基礎。もっと基礎から知りたい方はこちらをどうぞ。
  - id: ebistudy
    title: 体系的に、順番に学びたい方へ
    durationInFrames: 195
    notes: 続けて体系的に学びたい方向けに、Ebi StudyでMicrosoft資格、Windows Server、Azure、Claude Codeの動画講座を提供しています。ID関連は、アカウントとテナントの基礎、Entra ID認証と自動化、証明書の3コースが揃っています。月額990円です。
  - id: sources
    title: 出典
    durationInFrames: 205
    notes: 今日の内容の一次資料です。認証強度の概要、認証方式の一覧、フィッシング耐性パスワードレスの展開ガイド、そしてMicrosoftのセキュリティブログによるTycoon2FAの分析です。
  - id: thanks
    title: ご視聴ありがとうございました！
    durationInFrames: 190
    notes: 最後までご視聴いただき、ありがとうございました。役に立ったら高評価とチャンネル登録をお願いします。これからもWindows、Azure、Microsoft 365、生成AIの難しいテーマを分かりやすく解説していきます。
