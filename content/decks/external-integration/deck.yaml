slug: external-integration
title: 第14回 外部連携の全て ─ MCP vs 直接API
summary: Claude Codeを外の世界とつなぐ2つの道、MCPと直接APIを正直に比較する。「MCPは繋ぐだけでコンテキストを食う」がツール検索の既定化でどう変わったか（68ツールで0トークン）を実測で示し、残るトレードオフは制御性であることを整理する。Claude Codeの使い方コース 第14回。
status: public
visibility: members
createdAt: "2026-06-26"
updatedAt: "2026-07-26"
order: 14
tags:
  - claude-code
  - mcp
