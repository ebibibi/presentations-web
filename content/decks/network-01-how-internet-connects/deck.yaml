slug: network-01-how-internet-connects
title: ネットワーク超基礎 01 — このPCはどうやってインターネットにつながる？
summary: 自著のTCP/IP解説をもとに、家庭のWi-Fi・DNS・ゲートウェイ・NAT・返事を一歩ずつ追う。
status: draft
visibility: public
thumbnail: /thumbs/network-01-how-internet-connects.svg
createdAt: "2026-09-23"
updatedAt: "2026-09-24"
tags: [ network, tcp-ip, it-foundations, tutorial ]
slides:
  - id: opening
    title: Wi-FiにつないだだけでなぜWebページが開く？
    durationInFrames: 180
    notes: "前回の概要紹介を撤回し、自著『Windowsインフラ管理者入門』（2014）第3章・第5章の問い→予想→通信を追跡する順序に改稿。映像制作・公開は未実施。"
  - id: two-connections
    title: Wi-Fiは家の中の一区間
    durationInFrames: 210
    notes: "まず電波／線という見える部分から。家庭用一体機ではAPとルーターが同じ箱。Wi-Fi接続と外の回線を分けて話す。"
  - id: route
    title: URLの名前からIPを調べる
    durationInFrames: 210
    notes: "DNSで名前をIPへ変換。203.0.113.10は資料用の例で実在サーバーではない。"
  - id: dns-packet
    title: DNSの質問と答えの中身
    durationInFrames: 240
    notes: "UDP 53番。ルーターがDNSの中継役をする家庭が多い（直接プロバイダーや公開DNSへ出す構成もある）。ポート番号・アドレスは例。203.0.113.0/24 は RFC 5737 の文書用、MACは RFC 7042 の文書用 00-00-5E-00-53-xx。"
  - id: return
    title: 外の宛先ならゲートウェイへ
    durationInFrames: 210
    notes: "PCは全世界の経路を知らずデフォルトゲートウェイに渡す。サブネット情報を使って家の外と判断する。原稿の『たらいまわす』の発想。"
  - id: packet-anatomy
    title: パケットは封筒の入れ子
    durationInFrames: 240
    notes: "外側から Ethernet → IP → TCP → データ。宛先MAC（ルーター）と宛先IP（Webサイト）が違うことを強調。HTTPSなので中身は暗号化されて見えない。値はすべて文書用の例。"
  - id: outage
    title: NATで行きと帰りを追う
    durationInFrames: 230
    notes: "送信元の書き換えと返信の逆変換を口頭でも一往復させる。複数端末の区別はポートも必要。NATを防火壁そのものとは言わない。家庭によってIPv6や事業者NATもある。"
  - id: nat-rewrite
    title: NATの行き：送信元の書き換え
    durationInFrames: 240
    notes: "198.51.100.20 はルーターの公開IPの例（RFC 5737 文書用）。宛先IP・宛先ポート・中身は変えない。ポート番号の割り当て方はルーターにより違う。"
  - id: nat-return
    title: NATの帰り：宛先を元に戻す
    durationInFrames: 240
    notes: "NAT表を逆に引いて宛先を書き戻す。表に無い通信は通常届かないが、NATをファイアウォールそのものとは言わない。"
  - id: checklist
    title: インターネットに繋がらない時
    durationInFrames: 200
    notes: "自著第5章の順序：物理・接続→IP設定→DNS→サーバー接続→応答。図は回線断の一例に過ぎない。設定は勝手に変更しない。"
  - id: recap
    title: 今日のまとめ
    durationInFrames: 180
    notes: "家の入口・宛先の名前解決・ルーター・外の経路・帰りという順番を言い直す。次回はIPを掘り下げる。"
  - id: sources
    title: 原稿の出典と次の学び
    durationInFrames: 200
    notes: "出典は胡田昌彦『Windowsインフラ管理者入門』（カットシステム、2014年）第3章・第5章。図・原稿本文は転載せず、新しい説明として再構成。デッキはdraftのまま。"
