    title: EWS 廃止の段階
    durationInFrames: 300
    notes: 10月2日時点の自動登録、10月10日以降の許可リスト必須、次の段階での無効化と7日前の通知。
  - id: ews-hidden
    title: 知らないうちに EWS を使っているもの
    durationInFrames: 260
    notes: 従来の Outlook for Mac、Excel の Power Query、ハイブリッド構成。オンプレ側の EWS 自体は廃止されない。
