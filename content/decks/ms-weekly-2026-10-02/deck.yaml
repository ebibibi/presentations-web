slug: ms-weekly-2026-10-02
title: 【MS週報】Exchange Online の EWS 廃止が始まった ─ 10月2日までの Microsoft の変更20件
summary: 2026年10月2日までの1週間の Microsoft 関連の変更から、管理者に関係する20件をまとめました。いちばん大きいのは Exchange Online の EWS 廃止の開始で、10月10日以降は EWSEnabled を True にしておくだけでは EWS を使えなくなります。ExchangeOnlineManagement 3.10.1 への更新、Windows 11 26H2 の提供開始と設定バックアップの既定オン、Graph PowerShell SDK の Windows PowerShell 5.1 サポート廃止、WDS の非推奨化なども含めて、製品別に整理します。
