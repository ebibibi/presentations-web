slides:
  - id: opening
    title: 画像1枚18円が4.7円に
    durationInFrames: 200
    notes: |-
      サムネイルやアイキャッチを Azure 上の画像生成モデルに API で作らせています。手で開いて作ることはほとんどありません。だから「どのモデルを使うか」は絵の好みの話ではなく、毎日動く仕組みの部品を何にするかという話になります。Azure AI Foundry に新しいモデルが2つ入ったので、旧モデルと合わせて3つを実測で比べました。結論から言うと、1枚あたりの料金が4分の1になりました。
  - id: three-models
    title: 同じリージョンに3つ並んだ
    durationInFrames: 200
    notes: |-
      比較したのは3つ。旧モデルの gpt-image-2 と、新しく入った gpt-image-2.5 の flare と sunburst です。flare は速度重視、sunburst は高忠実度・精密編集として位置づけられています。すべて一般提供済みで、プレビューではありません。同じリージョンに並んでいるので、デプロイを足すだけで比べられました。
  - id: same-prompt
    title: 同じプロンプトで作った3枚
    durationInFrames: 240
    notes: |-
      完全に同一のプロンプト、1280x720、最高品質、各1発勝負で生成しました。モデル名は生成後に画像の下へ帯として焼き込んでいます。プロンプトに書くと生成内容が変わって比較が汚れるためです。見てのとおり、日本語は3つとも完璧です。濁点も小さい「っ」も崩れていません。どれを出してもそのままサムネイルとして使えます。
  - id: second-round
    title: 題材を変えても同じだった
    durationInFrames: 240
    notes: |-
      1回だけでは「たまたま得意な題材だった」を弾けません。そこで系統の違う題材でもう1ラウンド回しました。1ラウンド目は寒色・情報系、2ラウンド目は暖色・シネマ調です。こちらでも日本語の破綻はゼロ。6枚通して一度も崩れませんでした。差が出たのは文字ではなく、絵の作り込みと、画面の中に描かれる小さな文字の正しさの方でした。
  - id: speed
    title: 生成時間の実測値
    durationInFrames: 220
    notes: |-
      1280x720・最高品質で1枚を生成し終えるまでの実測秒数です。flare が旧モデルの約3.4倍速、sunburst が約1.8倍速でした。題材を振っても順位も比率もほぼ変わらないので、この差は題材によらない構造的なものだと判断しています。体感としても、1分半待つのと30秒で返ってくるのは別物で、試行錯誤のリズムが変わります。
  - id: price
    title: 料金 ─ 単価は同じ、トークンが4倍
    durationInFrames: 260
    notes: |-
      ここが本題です。まず、公開されている価格表APIには、これらの新しいモデルの単価がまだ載っていませんでした。載っているのは1つ前の世代までです。そこで実際に課金された金額と使用量から単価を逆算しました。出た単価は公表レートとほぼ一致し、しかも3モデル共通でした。新モデルだから高い、ということはありません。では何が4倍違うのか。1枚に使う出力トークンの量でした。旧モデルだけが3,787トークン、新しい2つはどちらも947トークンです。
  - id: decision
    title: sunburst に固定した
    durationInFrames: 220
    notes: |-
      判断の順番はこうです。まず日本語の精度では差がつかなかったので、「日本語が正確だから旧モデル」という既定の根拠そのものが消えました。次に、旧モデルは遅く、トークンが4倍で、絵も古い。3つとも負けているので使い続ける理由が残りません。最後に、新モデル2つは出力トークンが同数なので、sunburst を選んでも料金は flare と同じで、払うのは生成時間の差だけです。サムネイルは1日数枚なので画質を取りました。量産用途なら flare が正解なので、引数でモデルを切り替えられるようにしてあります。
  - id: reusable
    title: 持ち帰り ─ 単価は請求から逆算できる
    durationInFrames: 220
    notes: |-
      いちばん再利用できるのは sunburst という答えではなく、この4ステップの方です。価格表APIは新しいモデルにすぐ追いつくとは限りません。でも一度使えば請求額と使用量の両方が記録に残るので、割れば単価が出ます。公表レートと突き合わせれば検算にもなります。単価が同じなら、残る差は1枚あたりのトークン量だけで、これはAPIの応答から直接読めます。新しいモデルが出るたびに、自分の請求額で決められるようになります。
