slug: gpt-image-2-5
title: 画像1枚18円が4.7円に ─ Azureの画像生成モデルを実請求から選び直す
summary: Azure AI Foundry に新しい画像生成モデルが2つ入りました。同じプロンプトで3モデル・2ラウンド・計6枚を生成して並べると、日本語の品質では差がつきません。差がついたのは生成時間と、1枚あたりの料金でした。公開されている価格表に単価が載っていないモデルを、自分の請求データから逆算して比べる手順を、実測値と生成した画像そのもので示します。
