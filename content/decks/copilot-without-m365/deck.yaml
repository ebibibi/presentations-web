slug: copilot-without-m365
title: Copilotが活きるのはM365を素直に使う会社だけ — 前提が崩れると歪になる
summary: Microsoft 365 Copilotが本来の性能を出せるのは、Microsoft 365を本来の使い方で素直に使っている組織です。その前提が崩れたままライセンスを先に買うと何が起きるのかを、キーワードで整理します。
status: draft
visibility: public
createdAt: "2026-09-25"
updatedAt: "2026-09-25"
canvas: standard
tags:
  - copilot
  - microsoft
  - m365
  - sharepoint
  - teams
slides:
  - id: opening
    title: Copilotが活きるのはM365を素直に使う会社だけ
    durationInFrames: 240
    notes: 冒頭で答えを言い切る。CopilotはM365を本来の使い方で素直に使っている会社で本領を発揮する。火を見るより明らか、そもそも当たり前の話。その前提が崩れているところにCopilotを入れると歪な形になる。
  - id: cta-intro
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート（src/deck-shared.tsx の CtaSlide）。
  - id: premise
    title: 当たり前の前提
    durationInFrames: 280
    notes: M365を素直に使う → 仕事の中身がM365に溜まる → Copilotはその延長線上にある。Copilotは特別な魔法ではなく、M365の上に乗っている機能。
  - id: graph
    title: Copilotが読んでいるもの
    durationInFrames: 300
    notes: CopilotはMicrosoft Graph経由で、その人のメール・会議・チャット・ファイルを読んで答える。M365の中に仕事が無ければ、答える材料が無い。
  - id: platform
    title: M365はアプリだけじゃない
    durationInFrames: 300
    notes: M365と言ったら、Entra ID、条件付きアクセス、Purview、Agent 365まで全部含む。エンタープライズITを安心して使えるようにしてきた既存の仕組みの上に、CopilotやAIエージェントも自然に乗ってくる。だから素直に使っている会社ほど、AIも安心して広げられる。
  - id: gap
    title: 素直に使っていないM365
    durationInFrames: 320
    notes: 会議は対面や電話で記録が残らない。やり取りはメール添付。ファイルはファイルサーバー。仕事の単位は部署のフォルダ。これだとCopilotはただのチャットになる。素直な使い方なら、仕事の単位はTeamsの「チーム」で、ファイルもその中で作って共有する（裏側がSharePoint）。
  - id: harm
    title: Copilot以前の問題
    durationInFrames: 300
    notes: M365を素直に使わないこと自体に弊害がある。以前の動画でも「そういう組織があって残念」という話をした。正本が分からない、探せない、共同編集できない、新機能が来ても恩恵が届かない。Copilotはその延長線上の話。
  - id: order
    title: 前提が崩れたまま買うと
    durationInFrames: 300
    notes: ライセンス購入が決まる。でもCopilotが読める仕事の中身（コンテキスト）がM365に無いので、良い仕事ができない。使われない。個人で使っているChatGPTの方がはるかに高機能に見えてしまう。
  - id: kpi
    title: 売る側に目標があるのは当たり前
    durationInFrames: 300
    notes: 外資のITは目標がしっかりしている。ライセンス数も利用率も売る側のKPI。それ自体は当たり前で、悪いことではない。だからこそ、自分たちの環境が前提を満たしているかは買う側が確かめるしかない。
  - id: checklist
    title: 今日確認する3つ
    durationInFrames: 300
    notes: 1. M365をTeamsの「チーム」中心に素直に利用しているか。2. 必要な情報はM365にあるか。3. 求めているのは「個人や少数に特化した最先端で最強のAI」ではなく、「エンタープライズで大規模に信頼して使えるAI基盤」で間違いないか。
  - id: cta-outro
    title: 応援お願いします！
    durationInFrames: 150
    notes: 共通テンプレート（src/deck-shared.tsx の CtaSlide）。
