slug: jev-system-one
title: Jevは「文章を書かないAI」——何がすごくて、何は新しくないのか
summary: TypeSafeの判断特化モデルJevを一次情報で検証。LLMでもできる判断を、事前学習済みの汎用モデルで速く安く返す価値と、不得意・比較の注意点、LLMとの分業を解説する。
status: draft
visibility: public
canvas: standard
