slug: paas-ai-website-cost
title: 「サイトの運用は大変」はもう古い ─ PaaS＋AIの時代に、何にお金を払うべきか
summary: Webサイトと聞いてレンタルサーバーと保守契約を思い浮かべる前提は、クラウドのPaaSとAIで大きく変わりました。Cloudflareの無料プランでできること、公式が示すプランの用途区分とSLAの有無、SLAが付く金額、Azure Static Web Appsとの比較まで、公式の料金と規約で確かめます。
