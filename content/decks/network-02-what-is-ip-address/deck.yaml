slug: network-02-what-is-ip-address
title: ネットワーク超基礎 02 — IPアドレスって何？
summary: MACだけではなぜ届かないかという自著の問いから、同じ家と外のネットワークでIPの仕事を追う。
status: draft
visibility: public
thumbnail: /thumbs/network-02-what-is-ip-address.svg
createdAt: "2026-09-23"
updatedAt: "2026-09-24"
tags: [ network, tcp-ip, it-foundations, tutorial ]
slides:
  - id: opening
    title: 住所だけではIPは分からない
    durationInFrames: 180
    notes: "胡田昌彦『Windowsインフラ管理者入門』（2014）第3章の『MACアドレスだけではなぜいけないのか』→『IPアドレス』を入門用に再構成。"
  - id: addresses
    title: 家の中のPCとルーターのIP
    durationInFrames: 210
    notes: "192.168.1.10／192.168.1.1は例示。家の中でも端末とルーターを区別する。"
  - id: two-scopes
    title: MACだけで全世界に聞けるか
    durationInFrames: 220
    notes: "原稿の問いをそのまま議論の起点にする。ただし文章は引用せず書き直した。IPv4 ARPのブロードキャストはルーターを越えない。"
  - id: destination
    title: 外の宛先ならゲートウェイへ
    durationInFrames: 220
    notes: "目的地のIPと最初に渡す相手は別。PCはサブネットをもとに同一ネットワークか判断する。"
  - id: same-or-outside
    title: 宛先IPで宛先MACが変わる
    durationInFrames: 240
    notes: "サブネットマスク255.255.255.0の例。宛先IPで家の中か外かを判定し、家の外ならデフォルトゲートウェイのMACを宛先に書く。値は文書用。"
  - id: can-change
    title: 同じPCのIPは変わり得る
    durationInFrames: 200
    notes: "ネットワークの所属や割当てによって変化し得る。固定のこともある。MACも絶対不変ではないが本話では触れない。"
  - id: find-ip
    title: ipconfigで確かめる
    durationInFrames: 210
    notes: "利用中のアダプターのIPとデフォルトゲートウェイを見る。実値の公開に注意。"
  - id: recap
    title: IPの役割
    durationInFrames: 180
    notes: "同じネットワークへ直接／異なるネットワークへゲートウェイへ。現実には次の相手に渡すためにリンク層も必要。"
  - id: sources
    title: 出典と次の学び
    durationInFrames: 190
    notes: "出典は自著第3章。実原稿や図は転載していない。次はMACとARP。RFC 1918とRFC 5737を参照。"
