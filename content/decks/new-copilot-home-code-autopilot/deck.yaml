slug: new-copilot-home-code-autopilot
title: 新しいCopilotを解説 — Home・Code・Autopilotの3本柱と、課金の2階建て化
summary: 2026年9月25日にMicrosoftが発表した「新しいCopilot」を、公式ブログと発表動画から整理します。Home・Code・Autopilotの中身、アプリを社内で動かすCopilot Managed Runtime、定額（USL）と従量（UBB）に分かれる課金、提供時期、管理者が今日確認することまで。
