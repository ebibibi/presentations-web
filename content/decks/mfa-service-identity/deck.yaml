slug: mfa-service-identity
title: MFAをかけられないIDをどうするか ─ サービスIDの棚卸しと移行
summary: MFAを全社へ展開しようとすると、必ず「人がいないから多要素にできないID」が残る。人にどうMFAをかけるか（ゲストを含む）を押さえたうえで、残るIDをサインインログから見つけ、共通台帳へ載せ、実行場所とトークン発行能力で移行先を決めるまでを整理する。
status: draft
visibility: public
createdAt: "2026-08-29"
updatedAt: "2026-08-29"
order: 108
tags:
  - entra-id
  - mfa
  - conditional-access
  - managed-identity
  - workload-identity
  - security
slides:
  - id: opening
    title: MFAをかけられないIDをどうするか
    durationInFrames: 200
    notes: 多要素認証を全社へ広げよう、と決まった組織で必ず起きることがあります。人のアカウントは順調に進むのに、最後に「多要素をかけられないID」がまとまって残る。今日はそれをどう見つけて、どこへ移すかという話です。
  - id: profile
    title: 解説する人：胡田 昌彦
    durationInFrames: 190
    notes: 解説する胡田昌彦です。Microsoft MVPを14年連続で受賞し、Windows、Azure、Microsoft 365を実機で検証してきました。今日は運用の現場で必ず詰まるところだけを扱います。
  - id: the-scene
    title: 「今年こそMFAを全社へ」
    durationInFrames: 200
    notes: 想定する組織は、これまで多要素認証を本格的には適用してこなかった組織です。ランサムウェアの事例、保険や監査の要件、取引先からの要請。こうした理由で全社展開が決まります。人のアカウントの展開自体は、実はそれほど難しくありません。
  - id: the-wall
    title: 人がいないIDには、多要素をかけられない
    durationInFrames: 215
    notes: 多要素認証は、知っているもの、持っているもの、体の特徴といった異なる種類の要素を組み合わせて、利用者本人を確かめる仕組みです。ここで二つに分けます。サービスプリンシパルやマネージドIDのようなワークロードIDには、そもそも多要素認証という考え方を適用しません。一方で、夜間バッチやRPAがユーザーのIDを使っている場合は、IDとしては登録できても、承認する人がその場にいないので実質的に通せません。技術的な工夫の前に、まずこの区別から始めます。
  - id: exclusion-trap
    title: そして「除外グループ」が生まれる
    durationInFrames: 220
    notes: かけられないので除外します。ここまでは仕方がない。問題はその後です。除外グループは一度作ると必ず育ちます。困ったらここへ入れる、という運用になり、誰も中身を見なくなる。全社に多要素を入れたのに、攻撃者から見て一番おいしい入口が一箇所にまとまってしまう、という結果になりかねません。
  - id: what-is-service-id
    title: 「サービスID」と呼んでいるもの
    durationInFrames: 210
    notes: 呼び方は組織によって違います。サービスアカウント、システム利用ID、共有アカウント。共通しているのは、人が対話的にサインインしない、あるいは特定の人に紐づいていないIDだということです。まずは自分の組織にどれがあるかを言葉にします。
  - id: section-people
    title: SECTION 1 ─ まず、人にどうかけるのか
    durationInFrames: 150
    notes: 最初のセクションです。サービスIDの話へ行く前に、人へのかけ方を押さえます。ここが曖昧なままだと、本来かけられるものまで例外にしてしまうからです。
  - id: methods
    title: 使える「要素」は、思っているより多い
    durationInFrames: 250
    notes: MFAができないという相談の多くは、実は選択肢を知らないだけです。Microsoft Entra IDが対応する認証方式はこれだけあります。スマートフォンのアプリだけではありません。パスキー、Windows Hello、証明書、ハードウェアトークン。会社支給のスマホが無くても選べる方式は残っています。そしてMicrosoftが勧めるのはフィッシング耐性のある方式です。注意点を二つ。Windows Helloを二要素目として使えるのは、その利用者がパスキーを有効にして登録している場合です。ハードウェアOATHトークンは執筆時点でプレビューです。
  - id: guests
    title: 「相手がMFAを入れていないから無理」は誤り
    durationInFrames: 250
    notes: ゲストに多要素を必須にしようとして、相手から「うちはMFAを展開していないので対応できない」と言われることがあります。これは誤解です。B2Bコラボレーションのゲストは、既定では招待した側、つまりリソーステナントで多要素を登録して満たします。相手の組織が展開しているかどうかは関係ありません。多要素認証に必要なライセンスもリソーステナント側が用意し、ゲストがそれを消費する、と公式に書かれています。逆に、相手のテナントの多要素を信頼したい場合だけ、テナント間アクセス設定で明示的に信頼を設定します。
  - id: guest-methods
    title: ただし、ゲストが自社側で登録できる方式は限られる
    durationInFrames: 235
    notes: 一つ注意があります。ゲストが多要素を満たすとき、どちらのテナントで満たすかによって、受け付けられる方式が変わります。リソーステナント側で満たせるのは、SMS、音声通話、Authenticatorのプッシュ通知、ソフトウェアOATHトークンの4つです。FIDO2セキュリティキー、Windows Hello、証明書、ハードウェアOATHトークンは、ホームテナント側で満たした場合しか受け付けられません。したがってゲストにフィッシング耐性のある方式を求めるなら、二つが必要です。リソーステナントの条件付きアクセスでフィッシング耐性のある認証強度を要求すること。そして相手テナントの多要素を信頼する設定を入れることです。信頼を入れるだけでは強度は指定できません。なお認証強度をゲストへ適用できるのは、相手がMicrosoft Entra IDで認証する場合に限られます。
  - id: real-question
    title: ここから先が、本題の2つ
    durationInFrames: 195
    notes: 人へのかけ方を押さえたうえで、残るのがサービスIDです。問いは二つ。どこにいるのか。どこへ移すのか。順番に見ていきます。
  - id: section-inventory
    title: SECTION 2 ─ どこにいるのかを見つける
    durationInFrames: 150
    notes: 二つ目のセクション、棚卸しです。移行先の技術より先に、まず対象を見つけます。
  - id: inventory-logs
    title: サインインログは、4種類ある
    durationInFrames: 235
    notes: 棚卸しは手作業だと思われがちですが、サインインログでかなりの部分が埋まります。ここで大事なのは、サインインログが一種類ではないことです。対話型、非対話型、サービスプリンシパル、マネージドIDの4つがあります。旧来のサインインログの画面は対話型しか含みません。対話型のタブだけを見て「サービスIDは見当たらない」と結論するのが典型的な取りこぼしです。
  - id: sort-by-log
    title: 今のログを、3つに仕分ける
    durationInFrames: 245
    notes: まだ多要素をかけていない今の状態のログを見て仕分けます。ここで一つ、大事な注意があります。非対話型サインインのログは、サービスIDだけが並ぶ場所ではありません。普通の利用者の端末やアプリが、裏でリフレッシュトークンを使ってトークンを取り直した記録も、ここに大量に入ります。だから非対話型を丸ごとサービスID扱いすると、大半が誤検出になります。確実にワークロードIDだと言えるのは、サービスプリンシパルとマネージドIDのログです。人が対話でサインインしているものは、そのまま多要素の対象。そして非対話型は、利用者、クライアントアプリ、認証プロトコル、業務用途を追加で確認して、初めてサービスアカウントを抽出できます。
  - id: logs-blindspots
    title: それでも、ログで埋まらない5つ
    durationInFrames: 250
    notes: ただし万能ではありません。保持期間、既存トークン、Entra IDを通らない認証、所有者情報、そして規模。特に保持期間は重大で、既定の保持はEntra ID Freeで7日、P1とP2で30日です。四半期ごとのバッチはこの窓では絶対に捉えられませんし、月次でも調べるタイミング次第で漏れます。しかも診断設定を入れていないと、過去へ遡ることはできません。
  - id: retention
    title: 最初にやるのは、ログを貯め始めること
    durationInFrames: 210
    notes: 順番として、棚卸しの前にログの保持を延ばします。診断設定でLog Analyticsやストレージへ送っておけば、あとから長い期間で集計できます。ここを後回しにすると、3か月後に同じ場所で止まります。今日からできる一番安い一手です。
  - id: ledger
    title: 出てきたIDを、1つの台帳へ
    durationInFrames: 240
    notes: ログから出た情報を台帳にします。列はこの通りです。ここで大事なのは、多要素の例外台帳と、他のブロック施策の例外台帳を別々に作らないこと。別々に作ると、片方だけ見直されないIDが必ず残ります。台帳は一つにします。
  - id: ledger-human-part
    title: 台帳の「人にしか埋められない列」
    durationInFrames: 220
    notes: ログが埋めるのは、何が、いつ、どこから、何に、までです。誰の持ち物で、止めていいのか、いつ廃止するのかは、どこにも書かれていません。ここが棚卸しの本当のコストです。逆に言えば、機械が大半を埋めた表を持って所有者を探しに行く形にできれば、作業量は現実的になります。
  - id: section-destination
    title: SECTION 3 ─ どこへ移すのかを決める
    durationInFrames: 150
    notes: 三つ目のセクション、移行先です。ここは判断の順番さえ決めれば、機械的に振り分けられます。
  - id: classify
    title: 移行先は、4つの質問で決まる
    durationInFrames: 260
    notes: 上から順に答えるだけです。人が操作するなら、それは人のIDなので多要素をかけます。無人なら、動く場所を見ます。Azureの中で、かつ実行元のリソースがマネージドIDに対応し、接続先もMicrosoft Entra認証を受け付けるならマネージドID。場所だけでは決まらない点に注意してください。Azureの外なら、そのワークロードがMicrosoft Entraの要件を満たすOIDCトークンを発行できるかどうか。発行できるならフェデレーション。できないなら、資格情報を安全に保管できるかどうかで、証明書を使うアプリケーションか、期限付きの例外かが決まります。
  - id: not-by-name
    title: アプリ名だけで判断してはいけない
    durationInFrames: 225
    notes: 一つ注意です。同じアプリ名でも答えが違います。たとえばコマンドラインツールが出てきたとき、人が手で叩いているのか、スクリプトが無人で回しているのかで、最初の質問の答えが変わります。台帳に「人の操作があるか」という列を必ず作る理由がこれです。
  - id: managed-identity
    title: Azureの中なら、マネージドID
    durationInFrames: 235
    notes: Azureの中で動く処理なら、マネージドIDが第一候補です。IDそのものをAzureが管理するので、パスワードもシークレットもコードに出てきません。種類は二つあります。リソースと一対一で、リソースを消せば一緒に消えるのがシステム割り当て。独立したリソースとして先に作れて、複数から共有でき、フェデレーションも設定できるのがユーザー割り当てです。前提として、実行元のAzureリソースがマネージドIDに対応していることを確認してください。
  - id: arc
    title: Azure Arcを入れれば、「Azureの中」にできる
    durationInFrames: 250
    notes: ここが実務では効きます。オンプレミスや他社クラウドのサーバーでも、Azure ArcでオンボードすればマネージドIDを持てます。判断の木で言えば、Q2を「いいえ」から「はい」に変えられる、ということです。正確に言うと、処理が動く場所はオンプレのままで、そのサーバーがAzureのリソースとして管理できるようになり、サーバー上のプロセスがローカルのエンドポイントからトークンを取れるようになります。なおArc対応サーバーで使えるのはシステム割り当てマネージドIDです。対応OSはWindows Server 2012から2025まで、ただし2012と2012 R2は2026年11月にArcのサポートが終了予定です。Windows 10と11のクライアントも対応表に入っていますが、常時インターネットに接続され、電源につながれ、電源が入っている、サーバーのような使い方をしている場合に限られます。デジタルサイネージやPOS、バックオフィス端末が例として挙げられていて、長時間オフラインになる業務用PCは対象外です。そちらはIntuneかConfiguration Managerを使ってください、と明記されています。
  - id: mi-not-silver-bullet
    title: マネージドIDが使えない場合もある
    durationInFrames: 215
    notes: 万能ではありません。三つ条件があります。Azureの外でArcも入れられない場所。実行元のリソースがマネージドIDに対応していない場合。そして接続先のサービスがMicrosoft Entra認証を受け付けない場合です。使えるかどうかは、実行元と接続先の両方で確認します。
  - id: wif
    title: 要件を満たすOIDCトークンを出せるなら、フェデレーション
    durationInFrames: 240
    notes: Azureの外のワークロードでも、Microsoft Entraの要件を満たすOIDCトークンを発行できるなら、Workload identity federationが使えます。相手が発行する短命なトークンを、あらかじめ登録した発行者、サブジェクト、オーディエンスの組み合わせに基づいて、Entraのトークンと交換する仕組みです。長期のシークレットを相手側へ保存しなくてよくなるのが最大の利点です。OIDCなら何でも通るわけではなく、署名方式などの要件があります。
  - id: uami-vs-app
    title: 3つの器を並べて比べる
    durationInFrames: 255
    notes: フェデレーションを組むとき、器は二つから選べます。よく「どちらが安全ですか」と聞かれますが、安全性の優劣ではなく、IDをどこで何として管理するかという違いです。あわせてシステム割り当てマネージドIDも並べておきます。フェデレーション資格情報を設定できるのは、ユーザー割り当てマネージドIDと、アプリ登録で作られるアプリケーションオブジェクトだけです。システム割り当ては対象外です。なおアプリ登録の場合、資格情報はアプリケーションオブジェクト側に設定しますが、実際にテナント内で権限を持って動くのは対応するサービスプリンシパルです。
  - id: wif-guardrails
    title: フェデレーションで必ず確認すること
    durationInFrames: 235
    notes: 設定するときは、この四つをセットで確認します。信頼する相手を、組織全体ではなく対象のリポジトリや環境まで絞ること。本番と非本番でIDを分けること。権限は必要な範囲へ最小限で付けること。そして、フェデレーション資格情報は1つのIDあたり最大20件なので、多数の対象を1つのIDへ集約しないことです。
  - id: legacy-cage
    title: それでも残るIDは「檻」に入れる
    durationInFrames: 235
    notes: 手を入れられないものは必ず残ります。それは仕方がない。ただし、そこで終わりにしないでください。多要素が使えなくても、長いランダムなパスワード、接続元の限定、使えるアプリの限定、権限の最小化、失効日の設定で、危険度は大きく下げられます。何もせず除外グループへ入れるのとは別物です。
  - id: section-pitfall
    title: SECTION 4 ─ ここから、3つの落とし穴
    durationInFrames: 150
    notes: 最後のセクションです。ここまでの計画を実行に移すときに、多くの組織が踏む落とし穴を三つ挙げます。どれも「対策したつもり」になる種類のものです。
  - id: ropc
    title: 落とし穴1：パスワードを、アプリに直接渡す方式
    durationInFrames: 240
    notes: 一つ目です。アプリにIDとパスワードを直接渡してログインさせる古い方式があります。ブラウザーが出てこないので、多要素を差し込む場所がありません。そして重要なのは、いわゆるレガシー認証とは別物だということ。レガシー認証だけをブロックしても、それで大丈夫とは言えません。条件付きアクセスにこれだけを狙い撃ちする条件も用意されていないので、アプリ側の設定と移行で対処します。
  - id: device-code
    title: 落とし穴2：デバイスコードフロー
    durationInFrames: 245
    notes: 二つ目はデバイスコードフローです。画面に出たコードを別の端末で入力してサインインする仕組みで、キーボードやブラウザーが使いにくい機器のためのものです。攻撃者が自分でコードを発行して「これを入力してください」と送るだけで成立してしまうため、フィッシングに使われます。Microsoftは可能な限りブロックすることを勧めています。
  - id: device-code-scope
    title: 例外はアカウント単位になる
    durationInFrames: 250
    notes: ここは正確に押さえてください。条件付きアクセスには、デバイスフィルターという条件があり、デバイスIDや拡張属性で特定の端末を対象にしたり除外したりできます。ただし効くのはMicrosoft Entraに登録済みのデバイスだけです。未登録のデバイスは属性がすべて空として扱われ、等しいといった肯定の条件は一致しません。デバイスコードフローを使う機器は、そもそも入力手段が乏しくて登録していないことが多いので、ここが効かない場面が出てきます。だから公式のTeamsデバイス向けの設計は、端末単位ではなく、会議室端末のリソースアカウントをグループにして除外する形になっています。その場合、そのアカウントが別のアプリでデバイスコードフローを使うことまでは止められません。さらにプロトコルトラッキングという仕組みがあり、一度この方式を使ったセッションは、その後ほかの方式で認証してもポリシーの対象として扱われます。
  - id: report-only-trap
    title: 落とし穴3：レポート専用モードの「該当なし」
    durationInFrames: 260
    notes: 三つ目です。ブロックを入れる前にレポート専用モードで様子を見る、これは正しい手順です。ただし、評価期間中にサインインもトークン要求もしなかったIDは、そもそも評価結果に出てきません。だから該当ゼロに見えます。もう一つ、有効化しても一斉に止まるわけではありません。条件付きアクセスが評価されるのは、対話的なサインインのときだけではなく、リフレッシュトークンを使った非対話のトークン取得のときも含みます。既定のアクセストークンは1時間、継続的アクセス評価に対応したセッションは最大28時間有効で、その間は手元のトークンで動き続けます。さらに、ポリシーやグループの変更がExchange OnlineやSharePoint Onlineのようなリソース側へ届くまで最大24時間かかることがあり、一部の更新は2時間まで短縮されます。逆に継続的アクセス評価では、アカウントの無効化やパスワード変更といった重大イベントを受けて、有効期限前にアクセスが取り消されることもあります。つまり止まるタイミングは一様ではなく、次のトークン要求のときに順に効いてきます。すぐに効かせたいなら、対象ユーザーのセッションを明示的に失効させます。
  - id: rollout
    title: 展開の順番
    durationInFrames: 230
    notes: 全体の順番をまとめます。ログの保持を延ばす。棚卸しして台帳を作る。所有者を確定させる。移行できるものから先に移す。残すものを檻に入れる。レポート専用モードで測る。分割して有効化する。そして切り戻しの単位を先に決めておく。緊急時にポリシー全体を無効化するのではなく、決めた単位で戻せるようにしておくことが大事です。
  - id: microsoft-mfa
    title: 補足：テナントの除外が効かない場所がある
    durationInFrames: 220
    notes: 補足を一つ。Microsoftが定めた必須の多要素認証があります。対象はAzureポータル、Microsoft EntraとIntuneとMicrosoft 365の各管理センター、そして第2段階としてAzure CLI、Azure PowerShell、IaCツール、Azure Resource ManagerのREST APIです。Azure上のすべてのアプリが対象という意味ではありません。重要なのは、自分のテナントの条件付きアクセスで除外を設定していても、その除外はもう効かない、と公式に書かれていることです。緊急アクセス用のアカウントも対象で、パスキーか証明書ベース認証を設定するよう案内されています。一方、マネージドIDとサービスプリンシパルはこの必須化の対象外です。だからユーザーのIDで自動処理を回している構成は、除外では守れず、ワークロードIDへ移すのが答えになります。
  - id: recap
    title: 覚えるのは、この3つ
    durationInFrames: 215
