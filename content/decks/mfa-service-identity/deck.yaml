slug: mfa-service-identity
title: MFAをかけられないIDをどうするか ─ サービスIDの棚卸しと移行
summary: MFAを全社へ展開しようとすると、必ず「人がいないから多要素にできないID」が残る。そのIDをサインインログから見つけ、共通台帳へ載せ、マネージドIDやWorkload identity federationへ移すまでの順番を、除外設計の落とし穴とあわせて整理する。
status: draft
visibility: public
createdAt: "2026-08-29"
updatedAt: "2026-08-29"
order: 108
tags:
  - entra-id
  - mfa
  - conditional-access
  - managed-identity
  - workload-identity
  - security
slides:
  - id: opening
    title: MFAをかけられないIDをどうするか
    durationInFrames: 200
    notes: 多要素認証を全社へ広げよう、と決まった組織で必ず起きることがあります。人のアカウントは順調に進むのに、最後に「多要素をかけられないID」がまとまって残る。今日はそれをどう見つけて、どこへ移すかという話です。
  - id: profile
    title: 解説する人：胡田 昌彦
    durationInFrames: 190
    notes: 解説する胡田昌彦です。Microsoft MVPを14年連続で受賞し、Windows、Azure、Microsoft 365を実機で検証してきました。今日はID管理の中でも、運用の現場で必ず詰まる部分だけを扱います。
  - id: the-scene
    title: 「今年こそMFAを全社へ」
    durationInFrames: 200
    notes: 想定する組織は、これまで多要素認証を本格的には適用してこなかった組織です。ランサムウェアの事例、保険の要件、取引先からの要請、こうした理由で全社展開が決まります。人のアカウントの展開自体は、実はそれほど難しくありません。
  - id: the-wall
    title: 人がいないIDには、多要素をかけられない
    durationInFrames: 215
    notes: 多要素認証は、人がスマホを持って承認する仕組みです。だから、そこに人がいないIDには原理的にかけられません。夜間バッチ、RPA、会議室端末、監視ツール。技術的な工夫の前に、まずこの一点を認めるところから始めます。
  - id: exclusion-trap
    title: そして「除外グループ」が生まれる
    durationInFrames: 220
    notes: かけられないので除外します。ここまでは仕方がない。問題はその後です。除外グループは一度作ると必ず育ちます。困ったらここへ入れる、という運用になり、誰も中身を見なくなる。多要素を全社へ入れたのに、攻撃者にとって一番おいしい入口が一箇所にまとまる、という結果になりかねません。
  - id: what-is-service-id
    title: 「サービスID」と呼んでいるもの
    durationInFrames: 210
    notes: 呼び方は組織によって違います。サービスアカウント、システム利用ID、共有アカウント。共通しているのは、人が対話的にサインインしない、あるいは特定の人に紐づいていないIDだということです。まずは自分の組織にどれがあるかを言葉にします。
  - id: real-question
    title: 本当の問いは、2つだけ
    durationInFrames: 195
    notes: 難しく見えますが、問いは二つしかありません。どこにいるのか。どこへ移すのか。この順番を逆にすると失敗します。移行先の技術から入ると、必ず「うちにいくつあるか分からない」で止まるからです。
  - id: inventory-logs
    title: まず、サインインログで8割わかる
    durationInFrames: 235
    notes: 棚卸しは手作業だと思われがちですが、サインインログでかなりの部分が埋まります。ここで大事なのは、サインインログが一種類ではないことです。対話型、非対話型、サービスプリンシパル、マネージドID。管理画面の既定表示は対話型なので、サービスIDを探しているのに対話型だけを見て「見当たらない」となるのが典型的な取りこぼしです。
  - id: logs-excluded
    title: 「除外で通ったサインイン」は逆引きできる
    durationInFrames: 230
    notes: これは知っておくと強い手です。サインインログには、そのサインインに条件付きアクセスポリシーがどう適用されたかが記録されます。適用されなかった、除外された、という結果で絞り込めば、多要素の網から外れて通っているサインインを直接一覧にできます。「多要素をかけられないIDが分からない」の答えは、かなりの部分がここに落ちています。
  - id: logs-blindspots
    title: それでもログで埋まらない5つ
    durationInFrames: 250
    notes: ただし万能ではありません。保持期間、既存トークン、Entra IDを通らない認証、所有者情報、そして規模。特に保持期間は重大で、既定では最大30日です。月次や四半期のバッチは30日の窓に現れません。しかも診断設定を入れていないと、過去へ遡ることはできません。
  - id: retention
    title: 最初にやるのは、ログを貯め始めること
    durationInFrames: 210
    notes: 順番として、棚卸しの前にログの保持を延ばします。診断設定でLog Analyticsやストレージへ送っておけば、あとから長い期間で集計できます。ここを後回しにすると、3か月後に同じ場所で止まります。今日からできる一番安い一手です。
  - id: ledger
    title: 出てきたIDを、1つの台帳へ
    durationInFrames: 240
    notes: ログから出た情報を台帳にします。列はこの通りです。ここで大事なのは、多要素の例外台帳と、他のブロック施策の例外台帳を別々に作らないこと。別々に作ると、片方だけ見直されないIDが必ず残ります。台帳は一つにします。
  - id: ledger-human-part
    title: 台帳の「人にしか埋められない列」
    durationInFrames: 220
    notes: ログが埋めるのは、何が、いつ、どこから、何に、までです。誰の持ち物で、止めていいのか、いつ廃止するのかは、どこにも書かれていません。ここが棚卸しの本当のコストです。逆に言えば、機械が7割埋めた表を持って所有者を探しに行く形にできれば、作業量は現実的になります。
  - id: classify
    title: 移行先は、4分類で決まる
    durationInFrames: 245
    notes: 移行先の判断は、実はシンプルです。Azureの中で動く無人処理はマネージドID。Azureの外のワークロードはWorkload identity federation。マネージドIDが使えない製品は証明書を使うサービスプリンシパル。手を入れられないレガシーは、条件を絞った期限付き例外。この四つに振り分けます。
  - id: not-by-name
    title: アプリ名だけで判断してはいけない
    durationInFrames: 225
    notes: 一つ注意です。同じアプリ名でも移行先が違います。たとえばコマンドラインツールが出てきたとき、人が一時的に手で叩いているのか、スクリプトが無人で回しているのかで、答えが真逆になります。台帳に「人の操作があるか」という列を必ず作る理由がこれです。
  - id: managed-identity
    title: Azureの中なら、マネージドID
    durationInFrames: 225
    notes: Azureの中で動く処理なら、マネージドIDが第一候補です。IDそのものをAzureが管理し、パスワードもシークレットもコードに書きません。これが今回の話の中で一番きれいに解決できる部分です。すでに解説動画があるので、詳しくはそちらもご覧ください。
  - id: mi-not-silver-bullet
    title: ただし、万能薬ではない
    durationInFrames: 215
    notes: ここは強調しておきます。マネージドIDはすばらしい仕組みですが、全サービスIDを置き換えられるわけではありません。Azureの外では使えませんし、製品側が対応していないこともあります。「マネージドIDにすれば解決」と考えると、残りの大半で行き詰まります。
  - id: wif
    title: Azureの外なら、フェデレーション
    durationInFrames: 240
    notes: Azureの外で動くワークロードには、Workload identity federationという選択肢があります。相手側のID基盤が発行する短命なトークンを信頼して、Entraのトークンと交換する仕組みです。長期のシークレットを相手側へ保存しなくてよくなるのが最大の利点です。CI/CDが分かりやすい例です。
  - id: uami-vs-app
    title: よくある質問：マネージドIDとアプリ登録、どっち？
    durationInFrames: 250
    notes: フェデレーションを組むとき、ユーザー割り当てマネージドIDでも、アプリ登録でも構成できます。よく「どちらが安全ですか」と聞かれますが、安全性の優劣ではありません。IDをどこで何として管理するか、という管理モデルの違いです。なお、フェデレーション資格情報を設定できるマネージドIDはユーザー割り当て型だけで、システム割り当て型は対象外です。
  - id: wif-guardrails
    title: フェデレーションで必ず確認すること
    durationInFrames: 235
    notes: 設定するときは、この四つをセットで確認します。信頼する相手を、組織全体ではなく対象のリポジトリや環境まで絞ること。本番と非本番でIDを分けること。権限は必要な範囲へ最小限で付けること。そして、フェデレーション資格情報は1つのIDあたり最大20件なので、多数の対象を1つのIDへ集約しないこと。
  - id: legacy-cage
    title: どうしても残すIDは「檻」に入れる
    durationInFrames: 235
    notes: 手を入れられないレガシーは必ず残ります。それは仕方がない。ただし、多要素から外す代わりに、別の制御で囲みます。接続元、使えるアプリ、権限、そして失効日。除外グループを大きなゴミ箱にしないというのは、具体的にはこういうことです。
  - id: ropc
    title: 落とし穴1：パスワードを直接渡す古い方式
    durationInFrames: 240
    notes: ここから落とし穴を三つ。一つ目は、アプリにIDとパスワードを直接渡してログインさせる古い方式です。ブラウザーが出てこないので、多要素を差し込む場所がありません。そして重要なのは、いわゆるレガシー認証のブロックとは別物だということ。レガシー認証を止めたから大丈夫、とは言えません。条件付きアクセスにこれだけを狙い撃ちする条件も用意されていないので、アプリ側の設定と移行で対処します。
  - id: device-code
    title: 落とし穴2：デバイスコードフロー
    durationInFrames: 240
    notes: 二つ目はデバイスコードフローです。画面に出たコードを別の端末で入力してサインインする仕組みで、キーボードやブラウザーが使いにくい機器のためのものです。攻撃者が自分でコードを発行して「これを入力してください」と送るだけで成立してしまうため、フィッシングに使われます。原則ブロックし、本当に必要な機器だけを例外にする、というのが現在の方向です。
  - id: report-only-trap
    title: 落とし穴3：レポート専用モードは「該当なし」と嘘をつく
    durationInFrames: 245
    notes: 三つ目が一番こわい落とし穴です。新しいブロックを入れる前にレポート専用モードで様子を見る、これは正しい手順です。ただし、すでにトークンを持っている端末は、評価期間中に再認証しないかぎりログに現れません。レポートで該当ゼロだったのに、有効化した日に止まる。これを避けるには、機器の台帳との突き合わせと、再認証を強制したテストを組み合わせます。
  - id: rollout
    title: 展開の順番
    durationInFrames: 230
    notes: 全体の順番をまとめます。ログの保持を延ばす。棚卸しして台帳を作る。所有者を確定させる。移行できるものから先に移す。残すものを檻に入れる。レポート専用モードで測る。分割して有効化する。そして切り戻しの単位を先に決めておく。緊急時にポリシー全体を無効化するのではなく、決めた単位で戻せるようにしておくことが大事です。
  - id: microsoft-mfa
    title: 補足：テナントの除外だけでは守れない場所がある
    durationInFrames: 220
    notes: 最後に補足を一つ。Azureの管理画面などに対しては、Microsoft側で必須の多要素が適用されます。これは自分のテナントの条件付きアクセスで除外していても別に効きます。ユーザーのIDを無人処理へ使い続ける構成は、条件付きアクセスの除外だけでは維持できません。緊急アクセス用のアカウントについても、除外の有無だけでなく、必要な認証方式が登録済みかを確認しておきます。
  - id: recap
    title: 覚えるのは、この3つ
    durationInFrames: 210
    notes: まとめます。人がいないIDに多要素はかけられない。だから除外するのは正しいが、除外を台帳にしないと事故になる。棚卸しはサインインログで8割埋まり、残りは所有者を探す作業になる。移行先は四分類で決まり、マネージドIDは万能薬ではない。ここで本編はおしまいです。
  - id: related-videos
    title: 関連する解説動画
    durationInFrames: 215
    notes: 今日の話は、これまでに出した解説動画とつながっています。認証パターンの全体像、マネージドID、アプリ登録、リソースURL、条件付きアクセスの除外の挙動。今回の話で出てきた用語を、もっと基礎から知りたい方はこちらをどうぞ。
  - id: ebistudy
    title: 体系的に、順番に学びたい方へ
    durationInFrames: 195
    notes: 続けて体系的に学びたい方向けに、Ebi StudyでMicrosoft資格、Windows Server、Azure、Claude Codeの動画講座を提供しています。ID関連は、アカウントとテナントの基礎、Entra ID認証と自動化、証明書の3コースが揃っています。月額990円です。
  - id: sources
    title: Microsoft公式ドキュメント
    durationInFrames: 200
    notes: 今日の内容の一次資料です。条件付きアクセスの認証フロー条件、サインインログ、マネージドID、Workload identity federationに関する公式ドキュメントを挙げています。設定前には必ず最新の文書を確認してください。
  - id: thanks
    title: ご視聴ありがとうございました！
    durationInFrames: 190
    notes: 最後までご視聴いただき、ありがとうございました。役に立ったら高評価とチャンネル登録をお願いします。これからもWindows、Azure、Microsoft 365、生成AIの難しいテーマを分かりやすく解説していきます。
